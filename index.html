<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #030712; color: #f3f4f6; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .loading-shell { padding: 2rem; color: #9ca3af; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.3.1",
      "lucide-react": "https://esm.sh/lucide-react@0.428.0?deps=react@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div class="loading-shell">Cargando ExpenseTracker… (esto carga React + Tailwind desde CDN la primera vez)</div>
  </div>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      BarChart, Bar, ResponsiveContainer, CartesianGrid, XAxis, YAxis,
      Tooltip, Legend, Cell, PieChart, Pie,
    } from 'recharts';
    import {
      Calendar, RefreshCw, Settings, AlertTriangle, ChevronRight, X,
      TrendingUp, TrendingDown, Search, AlertCircle, Plus, Edit2, Trash2,
    } from 'lucide-react';

    // ────────────────────────────────────────────────────────────────────────
    // Config
    // ────────────────────────────────────────────────────────────────────────

    // Use the GitHub Contents API (NOT raw.githubusercontent.com). The raw
    // host rejects CORS preflight when an Authorization header is involved,
    // so browsers block the fetch. api.github.com has proper CORS for
    // authenticated requests and returns the raw content when we send the
    // Accept: application/vnd.github.raw header.
    const DEFAULT_URL = 'https://api.github.com/repos/calvachesantiago/expensetracker-snapshots/contents/dashboard_snapshot.json';
    const DEFAULT_WORKER_URL = 'https://kikito.calvachesantiago.workers.dev';
    const AUTO_REFRESH_MIN = 5;
    const INCOME_CATS = new Set(['Salario', 'Ingresos extras', 'Reembolsos', 'Otros ingresos']);
    const PARENT_COLORS = [
      '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4',
      '#ec4899', '#f97316', '#84cc16', '#a78bfa', '#22d3ee', '#fb7185',
    ];

    const fmtCOP = (n) => {
      if (n === null || n === undefined || isNaN(n)) return '—';
      const abs = Math.abs(n);
      if (abs >= 1_000_000) return `${(n / 1_000_000).toFixed(2)}M`;
      if (abs >= 1_000) return `${(n / 1_000).toFixed(0)}k`;
      return n.toLocaleString('es-CO');
    };
    const fmtCOPfull = (n) => {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return `COP ${Math.round(n).toLocaleString('es-CO')}`;
    };
    const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);

    const budgetColor = (spendPct, daysPct) => {
      if (spendPct >= 100) return 'bg-red-500';
      const over = spendPct - daysPct;
      if (over > 30) return 'bg-red-500';
      if (over > 10) return 'bg-amber-500';
      return 'bg-emerald-500';
    };

    // ────────────────────────────────────────────────────────────────────────
    // Data hook
    // ────────────────────────────────────────────────────────────────────────

    function useSnapshot(url, token) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastFetched, setLastFetched] = useState(null);

      const fetchData = useCallback(async () => {
        setLoading(true); setError(null);
        try {
          const headers = { Accept: 'application/vnd.github.raw' };
          if (token) headers.Authorization = `Bearer ${token}`;
          const res = await fetch(url, { headers, cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
          const json = await res.json();
          setData(json); setLastFetched(new Date());
          try { localStorage.setItem('et-cache', JSON.stringify(json)); } catch {}
        } catch (e) {
          try {
            const cached = localStorage.getItem('et-cache');
            if (cached) {
              setData(JSON.parse(cached));
              setError(`Live fetch failed (${e.message}); mostrando copia cacheada.`);
            } else {
              setError(e.message);
            }
          } catch { setError(e.message); }
        } finally { setLoading(false); }
      }, [url, token]);

      useEffect(() => { fetchData(); }, [fetchData]);
      useEffect(() => {
        const t = setInterval(fetchData, AUTO_REFRESH_MIN * 60 * 1000);
        return () => clearInterval(t);
      }, [fetchData]);

      return { data, loading, error, lastFetched, refetch: fetchData };
    }

    // ────────────────────────────────────────────────────────────────────────
    // Computations
    // ────────────────────────────────────────────────────────────────────────

    function lastNMonths(monthsList, n, anchor) {
      const idx = monthsList.indexOf(anchor);
      const end = idx >= 0 ? idx + 1 : monthsList.length;
      return monthsList.slice(Math.max(0, end - n), end);
    }

    function computeMonthStats(data, month) {
      const budgets = data.suggested_budgets || {};
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));

      let spendTotal = 0, budgetTotal = 0;
      const budgetRows = [];
      for (const p of parents) {
        const spend = (data.monthly_by_parent[p.name] || {})[month] || 0;
        const budget = (budgets[p.name]?.suggested_budget) || 0;
        spendTotal += spend; budgetTotal += budget;
        if (spend > 0 || budget > 0) budgetRows.push({ name: p.name, spend, budget });
      }
      // Uncategorized: counted in the total spend, but NOT shown in the
      // budget-vs-actual table (would be duplicate noise — the count is
      // already surfaced in "Necesita atención").
      const uncat = (data.monthly_by_parent[''] || {})[month] || 0;
      if (uncat > 0) spendTotal += uncat;

      budgetRows.sort((a, b) => {
        const ap = a.budget > 0 ? a.spend / a.budget : 9999;
        const bp = b.budget > 0 ? b.spend / b.budget : 9999;
        return bp - ap;
      });
      const income = data.transactions
        .filter((t) => t.ym === month && INCOME_CATS.has(t.parent))
        .reduce((s, t) => s + t.amount, 0);

      const [y, m] = month.split('-').map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();
      const today = new Date();
      const isCurrent = today.getFullYear() === y && today.getMonth() + 1 === m;
      const dayOfMonth = isCurrent ? today.getDate() : daysInMonth;
      const daysPct = Math.round((dayOfMonth / daysInMonth) * 100);
      const projected = isCurrent && dayOfMonth > 0
        ? Math.round((spendTotal / dayOfMonth) * daysInMonth) : spendTotal;

      return { month, spendTotal, budgetTotal, income, net: income - spendTotal,
               daysInMonth, dayOfMonth, daysPct, projected, budgetRows };
    }

    function computeYearStats(data, month) {
      const year = month.slice(0, 4);
      const monthsInYear = data.months.filter((m) => m.startsWith(year));
      const budgets = data.suggested_budgets || {};
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));
      let yearSpend = 0, yearBudget = 0;
      for (const p of parents) {
        yearBudget += ((budgets[p.name]?.suggested_budget) || 0) * 12;
        for (const m of monthsInYear) yearSpend += (data.monthly_by_parent[p.name] || {})[m] || 0;
      }
      for (const m of monthsInYear) yearSpend += (data.monthly_by_parent[''] || {})[m] || 0;
      const today = new Date();
      const cy = today.getFullYear();
      let elapsedPct;
      if (parseInt(year) < cy) elapsedPct = 100;
      else if (parseInt(year) > cy) elapsedPct = 0;
      else {
        const start = new Date(cy, 0, 1);
        elapsedPct = Math.round((((today - start) / (1000 * 60 * 60 * 24)) / 365) * 100);
      }
      return { year, yearSpend, yearBudget, elapsedPct };
    }

    function computeAttention(data, month) {
      // Categorization items (the main "needs attention" pile)
      const categorization = [];
      const uncatCount = data.transactions.filter((t) => !t.category_id && t.source !== 'Form (Drive)').length;
      if (uncatCount > 0) {
        const rappi = data.transactions.filter((t) => !t.category_id && t.merchant?.toUpperCase().includes('RAPPI')).length;
        const real = uncatCount - rappi;
        if (real > 0) categorization.push({ severity: 'warn',
          text: `${real} transacciones necesitan categoría`,
          sub: 'Próximamente vía Telegram bot' });
        if (rappi > 0) categorization.push({ severity: 'info',
          text: `${rappi} transacciones Rappi esperando el receipt parser` });
      }

      // Budget overages (rendered as a smaller, secondary list)
      const overBudget = [];
      const budgets = data.suggested_budgets || {};
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));
      for (const p of parents) {
        const spend = (data.monthly_by_parent[p.name] || {})[month] || 0;
        const budget = (budgets[p.name]?.suggested_budget) || 0;
        if (budget > 0 && spend / budget >= 1.0) {
          overBudget.push({
            name: p.name, pct: pct(spend, budget),
            spend, budget,
          });
        }
      }
      overBudget.sort((a, b) => b.pct - a.pct);

      return { categorization, overBudget };
    }

    // ────────────────────────────────────────────────────────────────────────
    // App
    // ────────────────────────────────────────────────────────────────────────

    function ExpenseTrackerDashboard() {
      const [url, setUrl] = useState(() => localStorage.getItem('et-url') || DEFAULT_URL);
      const [token, setToken] = useState(() => localStorage.getItem('et-token') || '');
      const [workerUrl, setWorkerUrl] = useState(() => localStorage.getItem('et-worker-url') || DEFAULT_WORKER_URL);
      const [workerSecret, setWorkerSecret] = useState(() => localStorage.getItem('et-worker-secret') || '');
      const [userIdentity, setUserIdentity] = useState(() => localStorage.getItem('et-user') || 'santi');
      const [showSettings, setShowSettings] = useState(false);
      const [showAddTx, setShowAddTx] = useState(false);
      const [tab, setTab] = useState('home');
      const [month, setMonth] = useState(null);
      const [selectedTx, setSelectedTx] = useState(null);
      const [toast, setToast] = useState(null);

      const { data, loading, error, lastFetched, refetch } = useSnapshot(url, token);

      // Helper: POST an edit to the Worker
      const postEdit = useCallback(async (edit) => {
        if (!workerSecret) {
          setToast({ type: 'error', text: 'Configura el secret del Worker en ⚙' });
          return false;
        }
        try {
          const fullEdit = { ...edit, by_user: userIdentity };
          const res = await fetch(`${workerUrl}/edit`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${workerSecret}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(fullEdit),
          });
          if (!res.ok) {
            const txt = await res.text();
            setToast({ type: 'error', text: `Error ${res.status}: ${txt.slice(0, 80)}` });
            return false;
          }
          setToast({ type: 'ok', text: '✅ En cola — se aplica en próxima sync' });
          return true;
        } catch (e) {
          setToast({ type: 'error', text: `Error de red: ${e.message}` });
          return false;
        }
      }, [workerUrl, workerSecret, userIdentity]);

      useEffect(() => {
        if (data?.summary?.current_month && !month) setMonth(data.summary.current_month);
      }, [data, month]);

      useEffect(() => {
        if (error && /401|403/.test(error) && !token) setShowSettings(true);
      }, [error, token]);

      if (loading && !data) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-gray-400 flex items-center gap-2">
              <RefreshCw className="animate-spin" size={20} /> Cargando snapshot…
            </div>
          </div>
        );
      }
      if (!data && error) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="max-w-md bg-red-950/40 border border-red-900 rounded-xl p-6">
              <AlertCircle size={32} className="text-red-400 mb-3" />
              <h2 className="text-lg font-semibold mb-2">No pude cargar los datos</h2>
              <p className="text-sm text-red-300 mb-4">{error}</p>
              <button onClick={() => setShowSettings(true)}
                      className="px-4 py-2 bg-red-900/50 hover:bg-red-900 rounded text-sm">
                Configurar URL + token
              </button>
            </div>
            {showSettings && (
              <SettingsPanel url={url} setUrl={(u) => { setUrl(u); localStorage.setItem('et-url', u); }}
                token={token} setToken={(t) => { setToken(t); localStorage.setItem('et-token', t); }}
                onClose={() => setShowSettings(false)} onApply={refetch} />
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen">
          <Header data={data} month={month} setMonth={setMonth}
            lastFetched={lastFetched} loading={loading}
            onRefresh={refetch} onOpenSettings={() => setShowSettings(true)}
            onAddTx={() => setShowAddTx(true)} />
          <Tabs tab={tab} setTab={setTab} />
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 pb-24">
            {error && (
              <div className="mb-4 px-4 py-2 bg-amber-950/40 border border-amber-900 rounded text-sm text-amber-300 flex items-center gap-2">
                <AlertTriangle size={14} /> {error}
              </div>
            )}
            {tab === 'home' && <HomeView data={data} month={month} onSelectTx={setSelectedTx} />}
            {tab === 'trends' && <TrendsView data={data} month={month} />}
            {tab === 'budgets' && <BudgetsView data={data} />}
            {tab === 'all' && <AllTxsView data={data} onSelectTx={setSelectedTx} />}
          </main>
          {selectedTx && (
            <TxDetailDrawer
              tx={selectedTx} data={data}
              onClose={() => setSelectedTx(null)}
              postEdit={postEdit}
            />
          )}
          {showAddTx && (
            <AddTxModal data={data} userIdentity={userIdentity}
              onClose={() => setShowAddTx(false)} postEdit={postEdit} />
          )}
          {showSettings && (
            <SettingsPanel
              url={url} setUrl={(u) => { setUrl(u); localStorage.setItem('et-url', u); }}
              token={token} setToken={(t) => { setToken(t); localStorage.setItem('et-token', t); }}
              workerUrl={workerUrl} setWorkerUrl={(u) => { setWorkerUrl(u); localStorage.setItem('et-worker-url', u); }}
              workerSecret={workerSecret} setWorkerSecret={(s) => { setWorkerSecret(s); localStorage.setItem('et-worker-secret', s); }}
              userIdentity={userIdentity} setUserIdentity={(u) => { setUserIdentity(u); localStorage.setItem('et-user', u); }}
              onClose={() => setShowSettings(false)} onApply={refetch} />
          )}
          {toast && <Toast toast={toast} onDismiss={() => setToast(null)} />}
        </div>
      );
    }

    function Toast({ toast, onDismiss }) {
      useEffect(() => {
        const t = setTimeout(onDismiss, 4000);
        return () => clearTimeout(t);
      }, [onDismiss]);
      const bg = toast.type === 'ok' ? 'bg-emerald-700 border-emerald-600' : 'bg-red-800 border-red-700';
      return (
        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 ${bg} border rounded-lg px-4 py-2 text-sm shadow-lg max-w-md`}>
          {toast.text}
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────────────────
    // Sub-components
    // ────────────────────────────────────────────────────────────────────────

    function Header({ data, month, setMonth, lastFetched, loading, onRefresh, onOpenSettings, onAddTx }) {
      const months = data?.months || [];
      const minutesAgo = lastFetched ? Math.floor((Date.now() - lastFetched.getTime()) / 60000) : null;
      return (
        <header className="sticky top-0 z-30 bg-gray-950/95 backdrop-blur border-b border-gray-800">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <h1 className="text-base font-bold">ExpenseTracker</h1>
              <span className="hidden sm:block text-[10px] text-gray-500">
                {data?.summary?.first_month} → {data?.summary?.last_month}
              </span>
            </div>
            <div className="flex items-center gap-2">
              <select value={month || ''} onChange={(e) => setMonth(e.target.value)}
                className="bg-gray-900 border border-gray-800 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500">
                {[...months].reverse().map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
              <button onClick={onAddTx}
                className="flex items-center gap-1 px-2 py-1 bg-blue-700 hover:bg-blue-600 border border-blue-600 rounded text-xs font-medium"
                title="Agregar cash o ingreso">
                <Plus size={12} />
                <span className="hidden sm:inline">Agregar</span>
              </button>
              <button onClick={onRefresh} disabled={loading}
                className="flex items-center gap-1 px-2 py-1 bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded text-xs"
                title={lastFetched ? `Última carga: ${lastFetched.toLocaleString()}` : 'Recargar'}>
                <RefreshCw size={12} className={loading ? 'animate-spin' : ''} />
                <span className="hidden sm:inline">
                  {minutesAgo === null ? 'Cargar' : minutesAgo < 1 ? 'ahora' : `${minutesAgo}m`}
                </span>
              </button>
              <button onClick={onOpenSettings} className="p-1 hover:bg-gray-900 rounded" title="Configuración">
                <Settings size={16} className="text-gray-400" />
              </button>
            </div>
          </div>
        </header>
      );
    }

    function Tabs({ tab, setTab }) {
      const tabs = [
        { id: 'home', label: 'Inicio' },
        { id: 'trends', label: 'Tendencias' },
        { id: 'budgets', label: 'Presupuestos' },
        { id: 'all', label: 'Todas las transacciones' },
      ];
      return (
        <nav className="border-b border-gray-800 bg-gray-950/80">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 flex gap-4 overflow-x-auto">
            {tabs.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`py-3 text-sm whitespace-nowrap border-b-2 transition-colors ${
                  tab === t.id ? 'border-blue-500 text-blue-400'
                              : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
                {t.label}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    function HomeView({ data, month, onSelectTx }) {
      if (!month) return null;
      const stats = useMemo(() => computeMonthStats(data, month), [data, month]);
      const yearStats = useMemo(() => computeYearStats(data, month), [data, month]);
      const attention = useMemo(() => computeAttention(data, month), [data, month]);
      return (
        <div className="space-y-4">
          <KPICards stats={stats} yearStats={yearStats} month={month} />
          {attention.categorization.length > 0 && <NeedsAttention items={attention.categorization} />}
          {attention.overBudget.length > 0 && <OverBudgetMini items={attention.overBudget} month={month} />}
          <BudgetTable rows={stats.budgetRows} data={data} month={month} />
          <TrendsChart data={data} months={lastNMonths(data.months, 6, month)} />
          <RecentActivity data={data} onSelectTx={onSelectTx} />
        </div>
      );
    }

    function OverBudgetMini({ items, month }) {
      return (
        <section>
          <h2 className="text-xs uppercase tracking-wide text-gray-500 mb-2">
            Por encima del presupuesto en {month}
          </h2>
          <div className="bg-gray-900/60 border border-gray-800 rounded-lg px-3 py-2 flex flex-wrap gap-x-4 gap-y-1 text-xs">
            {items.map((it) => (
              <span key={it.name} className="text-gray-400">
                <span className="text-gray-200">{it.name}</span>
                {' '}
                <span className={it.pct >= 200 ? 'text-red-400' : 'text-amber-400'}>
                  {it.pct}%
                </span>
                {' '}
                <span className="text-gray-500">({fmtCOPfull(it.spend)} / {fmtCOPfull(it.budget)})</span>
              </span>
            ))}
          </div>
        </section>
      );
    }

    function KPICards({ stats, yearStats, month }) {
      const monthPct = pct(stats.spendTotal, stats.budgetTotal);
      const yearPct = pct(yearStats.yearSpend, yearStats.yearBudget);
      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          <KPICard title={`Este mes — ${month}`} primary={fmtCOPfull(stats.spendTotal)}
            secondary={`de ${fmtCOPfull(stats.budgetTotal)} · ${monthPct}%`}
            progress={Math.min(monthPct, 200)}
            color={budgetColor(monthPct, stats.daysPct)}
            footer={stats.dayOfMonth < stats.daysInMonth
              ? `Día ${stats.dayOfMonth} de ${stats.daysInMonth} (${stats.daysPct}%) · Proyección: ${fmtCOPfull(stats.projected)}`
              : `Mes cerrado`} />
          <KPICard title={`Este año — ${yearStats.year}`} primary={fmtCOPfull(yearStats.yearSpend)}
            secondary={`de ${fmtCOPfull(yearStats.yearBudget)} · ${yearPct}%`}
            progress={Math.min(yearPct, 100)}
            color={budgetColor(yearPct, yearStats.elapsedPct)}
            footer={`${yearStats.elapsedPct}% del año transcurrido`} />
          <KPICard title="Flujo de caja del mes" primary={fmtCOPfull(stats.net)}
            secondary={`Ingresos ${fmtCOPfull(stats.income)} − Gastos ${fmtCOPfull(stats.spendTotal)}`}
            progress={null}
            color={stats.net >= 0 ? 'bg-emerald-500' : 'bg-red-500'}
            footer={stats.net >= 0 ? '✓ En positivo' : '⚠ Gastos > ingresos'}
            icon={stats.net >= 0 ? <TrendingUp size={20} /> : <TrendingDown size={20} />} />
        </div>
      );
    }

    function KPICard({ title, primary, secondary, progress, color, footer, icon }) {
      return (
        <div className="bg-gray-900 border border-gray-800 rounded-lg p-3.5">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[10px] uppercase tracking-wide text-gray-400">{title}</span>
            {icon && <span className="text-gray-500">{icon}</span>}
          </div>
          <div className="text-xl font-bold leading-tight">{primary}</div>
          <div className="text-xs text-gray-400 mb-2">{secondary}</div>
          {progress !== null && (
            <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden mb-2">
              <div className={`h-full ${color} rounded-full transition-all`} style={{ width: `${Math.min(progress, 100)}%` }} />
            </div>
          )}
          <div className="text-[10px] text-gray-500">{footer}</div>
        </div>
      );
    }

    function NeedsAttention({ items }) {
      return (
        <section>
          <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Necesita atención</h2>
          <div className="bg-gray-900 border border-gray-800 rounded-lg divide-y divide-gray-800">
            {items.map((it, i) => (
              <div key={i} className="px-3 py-2 flex items-start gap-2">
                <span className="mt-0.5">

    function BudgetTable({ rows, data, month }) {
      const [expanded, setExpanded] = useState(new Set());
      const toggle = (name) => {
        const next = new Set(expanded);
        if (next.has(name)) next.delete(name); else next.add(name);
        setExpanded(next);
      };

      // For each parent, find its subs from monthly_by_sub for the current month
      const subsForParent = (parentName) => {
        const out = [];
        const prefix = `${parentName} / `;
        for (const [key, byMonth] of Object.entries(data.monthly_by_sub || {})) {
          if (!key.startsWith(prefix)) continue;
          const spend = byMonth[month] || 0;
          if (spend <= 0) continue;
          out.push({ name: key.slice(prefix.length), spend });
        }
        return out.sort((a, b) => b.spend - a.spend);
      };

      return (
        <section>
          <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Presupuesto vs gasto — mes actual</h2>
          <div className="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
            {rows.map((r) => {
              const p = r.budget > 0 ? pct(r.spend, r.budget) : null;
              const color = r.budget > 0 ? budgetColor(p, 50) : 'bg-gray-700';
              const isOpen = expanded.has(r.name);
              const subs = isOpen ? subsForParent(r.name) : [];
              return (
                <div key={r.name} className="border-b border-gray-800 last:border-b-0">
                  <button
                    onClick={() => toggle(r.name)}
                    className="w-full text-left px-3 py-2 hover:bg-gray-800/30 transition-colors"
                  >
                    <div className="flex items-center justify-between text-xs mb-1">
                      <span className="flex items-center gap-1.5">
                        <ChevronRight size={11}
                          className={`text-gray-600 transition-transform ${isOpen ? 'rotate-90' : ''}`} />
                        {r.name}
                      </span>
                      <span className="text-gray-400 text-[11px]">
                        {fmtCOPfull(r.spend)} {r.budget > 0 && <span className="text-gray-600">/ {fmtCOPfull(r.budget)}</span>}
                        {p !== null && (
                          <span className={`ml-2 font-medium ${p >= 100 ? 'text-red-400' : p >= 80 ? 'text-amber-400' : 'text-emerald-400'}`}>{p}%</span>
                        )}
                      </span>
                    </div>
                    <div className="h-1 bg-gray-800 rounded-full overflow-hidden">
                      <div className={`h-full ${color} rounded-full transition-all`}
                           style={{ width: `${r.budget > 0 ? Math.min(p, 100) : 100}%` }} />
                    </div>
                  </button>
                  {isOpen && (
                    <div className="bg-gray-950/50 border-t border-gray-800 px-3 py-1.5">
                      {subs.length === 0 ? (
                        <div className="text-[10px] text-gray-600 py-1">(sin gasto en subcategorías este mes)</div>
                      ) : (
                        subs.map((s) => {
                          const sharePct = r.spend > 0 ? Math.round((s.spend / r.spend) * 100) : 0;
                          return (
                            <div key={s.name} className="flex items-center gap-2 py-1">
                              <div className="flex-1 text-[11px] text-gray-300">{s.name}</div>
                              <div className="text-[10px] text-gray-500 w-10 text-right">{sharePct}%</div>
                              <div className="text-[11px] text-gray-400 w-28 text-right">{fmtCOPfull(s.spend)}</div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    function TxDetailDrawer({ tx, data, onClose, postEdit }) {
      const [editing, setEditing] = useState(false);
      const [path, setPath] = useState(tx.label || '');
      const [amount, setAmount] = useState(tx.amount);
      const [note, setNote] = useState(tx.notes || '');
      const [addedBy, setAddedBy] = useState(tx.added_by || '');
      const [submitting, setSubmitting] = useState(false);

      const allPaths = useMemo(() => {
        const out = new Set();
        const parents = data.categories?.parents || [];
        for (const p of parents) {
          out.add(p.name);
          for (const s of (p.subs || [])) out.add(`${p.name} / ${s.name}`);
        }
        return [...out].sort();
      }, [data]);

      const submit = async (kindAndExtra) => {
        setSubmitting(true);
        const ok = await postEdit({ ...kindAndExtra, tx_id: tx.id });
        setSubmitting(false);
        if (ok) { onClose(); }
      };

      const saveAll = async () => {
        // Send each change as its own edit (the queue applies them in order)
        if (path !== tx.label) {
          await submit({ kind: 'recategorize', path });
          return;
        }
        if (amount !== tx.amount) {
          await submit({ kind: 'edit_amount', amount: parseInt(amount, 10) });
          return;
        }
        if (note !== (tx.notes || '')) {
          await submit({ kind: 'edit_note', note });
          return;
        }
        if (addedBy !== (tx.added_by || '')) {
          await submit({ kind: 'tag', added_by: addedBy || null });
          return;
        }
        setToast?.({ type: 'ok', text: 'No hay cambios' });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex" onClick={onClose}>
          <div className="flex-1 bg-black/50" />
          <div className="w-full sm:w-[28rem] bg-gray-900 border-l border-gray-800 overflow-y-auto"
               onClick={(e) => e.stopPropagation()}>
            <div className="sticky top-0 bg-gray-900 border-b border-gray-800 px-5 py-3 flex items-center justify-between">
              <h3 className="font-semibold text-sm">Transacción #{tx.id}</h3>
              <div className="flex items-center gap-2">
                <button onClick={() => setEditing(!editing)}
                        className={`text-xs px-2 py-1 rounded ${editing ? 'bg-gray-700' : 'bg-blue-700 hover:bg-blue-600'}`}>
                  {editing ? 'Cancelar' : 'Editar'}
                </button>
                <button onClick={onClose} className="text-gray-400 hover:text-white"><X size={18} /></button>
              </div>
            </div>

            <div className="p-4 space-y-3 text-sm">
              <DetailRow label="Comercio" value={tx.merchant} />
              {!editing && <DetailRow label="Monto" value={fmtCOPfull(tx.amount)} />}
              <DetailRow label="Fecha" value={tx.date + (tx.time ? ` ${tx.time}` : '')} />
              {!editing && <DetailRow label="Categoría"
                value={tx.category_id ? tx.label : <span className="text-amber-400">Sin categoría</span>} />}
              {!editing && <DetailRow label="Atribución"
                value={tx.added_by ? <span className="text-blue-300">{tx.added_by}</span> : <span className="text-gray-500">— (compartido / sin etiqueta)</span>} />}
              <DetailRow label="Origen" value={tx.source} />
              <DetailRow label="Pago" value={tx.payment_method || '—'} />
              {!editing && tx.notes && <DetailRow label="Notas" value={tx.notes} />}

              {editing && (
                <div className="mt-4 pt-4 border-t border-gray-800 space-y-3">
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400">Categoría</span>
                    <input type="text" list="path-suggestions" value={path}
                      onChange={(e) => setPath(e.target.value)}
                      className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs" />
                    <datalist id="path-suggestions">
                      {allPaths.map((p) => <option key={p} value={p} />)}
                    </datalist>
                  </label>

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400">Monto (COP)</span>
                    <input type="number" value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs" />
                  </label>

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400">Atribución</span>
                    <select value={addedBy} onChange={(e) => setAddedBy(e.target.value)}
                      className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs">
                      <option value="">— (compartido / sin etiqueta)</option>
                      <option value="santi">Santi</option>
                      <option value="lau">Lau</option>
                    </select>
                  </label>

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400">Nota</span>
                    <input type="text" value={note} onChange={(e) => setNote(e.target.value)}
                      className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs" />
                  </label>

                  <button onClick={saveAll} disabled={submitting}
                    className="w-full px-3 py-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded text-sm font-medium">
                    {submitting ? 'Enviando…' : 'Guardar cambios'}
                  </button>

                  <div className="pt-3 border-t border-gray-800 grid grid-cols-2 gap-2">
                    <button onClick={() => submit({ kind: 'not_mine' })}
                            disabled={submitting}
                            className="px-3 py-2 bg-amber-900/40 hover:bg-amber-900/60 border border-amber-800 rounded text-xs">
                      🚫 No fue mío
                    </button>
                    <button onClick={() => {
                      const v = prompt('¿Cuánto me deben los demás? (COP)');
                      if (v) submit({ kind: 'split', split_owed: parseInt(v, 10) });
                    }}
                            disabled={submitting}
                            className="px-3 py-2 bg-amber-900/40 hover:bg-amber-900/60 border border-amber-800 rounded text-xs">
                      ➗ Split parcial
                    </button>
                    <button onClick={() => {
                      if (confirm('Borrar transacción (soft delete)?')) submit({ kind: 'delete' });
                    }}
                            disabled={submitting}
                            className="col-span-2 px-3 py-2 bg-red-900/40 hover:bg-red-900/60 border border-red-800 rounded text-xs">
                      🗑 Borrar
                    </button>
                  </div>
                </div>
              )}

              <div className="pt-3 mt-3 border-t border-gray-800">
                <p className="text-[10px] text-gray-500">
                  Los cambios se envían a Kikito (Worker en Cloudflare) y se aplican en la próxima sync (8am / 8pm).
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

                </button>
              </div>

              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-gray-400">Monto (COP)</span>
                <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)}
                  placeholder="25000"
                  className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
              </label>

              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-gray-400">Categoría</span>
                <input type="text" list="add-path-suggestions" value={path}
                  onChange={(e) => setPath(e.target.value)}
                  placeholder={kind === 'add_income' ? 'Salario' : 'Alimentación / Café'}
                  className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
                <datalist id="add-path-suggestions">
                  {allPaths.map((p) => <option key={p} value={p} />)}
                </datalist>
              </label>

              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-gray-400">Nota (opcional)</span>
                <input type="text" value={note} onChange={(e) => setNote(e.target.value)}
                  placeholder="café con amiga"
                  className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
              </label>

              <div className="text-[10px] text-gray-500">
                Se agregará a tu nombre ({userIdentity}). Se procesa en próxima sync.
              </div>
            </div>
            <div className="px-5 py-3 border-t border-gray-800 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-sm">Cancelar</button>
              <button onClick={submit} disabled={submitting || !amount || !path}
                      className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded text-sm font-medium">
                {submitting ? 'Enviando…' : 'Agregar'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DetailRow({ label, value }) {
      return (
        <div className="flex justify-between gap-4">
          <span className="text-gray-400 flex-shrink-0">{label}</span>
          <span className="text-right">{value}</span>
        </div>
      );
    }

    function SettingsPanel({
      url, setUrl, token, setToken,
      workerUrl, setWorkerUrl, workerSecret, setWorkerSecret,
      userIdentity, setUserIdentity,
      onClose, onApply,
    }) {
      const [u, setU] = useState(url);
      const [t, setT] = useState(token);
      const [wU, setWU] = useState(workerUrl);
      const [wS, setWS] = useState(workerSecret);
      const [uid, setUid] = useState(userIdentity);
      const [showToken, setShowToken] = useState(false);
      const [showSecret, setShowSecret] = useState(false);
      const apply = () => {
        setUrl(u); setToken(t); setWorkerUrl(wU); setWorkerSecret(wS); setUserIdentity(uid);
        onApply(); onClose();
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
          <div className="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-md max-h-[90vh] overflow-y-auto"
               onClick={(e) => e.stopPropagation()}>
            <div className="sticky top-0 bg-gray-900 px-5 py-3 border-b border-gray-800 flex items-center justify-between">
              <h3 className="font-semibold">Configuración</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X size={18} /></button>
            </div>
            <div className="p-5 space-y-4 text-sm">
              <div className="pb-2 border-b border-gray-800">
                <h4 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Identidad</h4>
                <label className="block">
                  <span className="text-xs text-gray-400">¿Quién eres?</span>
                  <select value={uid} onChange={(e) => setUid(e.target.value)}
                    className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    <option value="santi">Santi</option>
                    <option value="lau">Lau</option>
                  </select>
                  <span className="text-[10px] text-gray-500 block mt-1">
                    Cada edición que envíes desde este navegador queda atribuida a ti.
                  </span>
                </label>
              </div>

              <div className="pb-2 border-b border-gray-800">
                <h4 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Datos (lectura)</h4>
                <label className="block">
                  <span className="text-xs text-gray-400">URL del snapshot</span>
                  <input type="text" value={u} onChange={(e) => setU(e.target.value)}
                    className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                </label>
                <label className="block mt-2">
                  <span className="text-xs text-gray-400">Token GitHub (read-only)</span>
                  <div className="flex gap-2 mt-1">
                    <input type={showToken ? 'text' : 'password'} value={t} onChange={(e) => setT(e.target.value)}
                      placeholder="github_pat_..."
                      className="flex-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                    <button onClick={() => setShowToken(!showToken)}
                            className="px-2 bg-gray-800 border border-gray-700 rounded text-xs">
                      {showToken ? '🙈' : '👁'}
                    </button>
                  </div>
                </label>
              </div>

              <div className="pb-2">
                <h4 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Edición (escritura)</h4>
                <label className="block">
                  <span className="text-xs text-gray-400">URL del Worker (Kikito)</span>
                  <input type="text" value={wU} onChange={(e) => setWU(e.target.value)}
                    className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                </label>
                <label className="block mt-2">
                  <span className="text-xs text-gray-400">Secret del Worker (DASHBOARD_SECRET)</span>
                  <div className="flex gap-2 mt-1">
                    <input type={showSecret ? 'text' : 'password'} value={wS} onChange={(e) => setWS(e.target.value)}
                      placeholder="el mismo que está en Cloudflare"
                      className="flex-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                    <button onClick={() => setShowSecret(!showSecret)}
                            className="px-2 bg-gray-800 border border-gray-700 rounded text-xs">
                      {showSecret ? '🙈' : '👁'}
                    </button>
                  </div>
                  <span className="text-[10px] text-gray-500 block mt-1">
                    Sin esto, los botones de Editar / Agregar no funcionarán.
                  </span>
                </label>
              </div>

              <div className="text-[10px] text-gray-500 pt-2 border-t border-gray-800">
                <p>Auto-refresh: cada {AUTO_REFRESH_MIN} minutos.</p>
                <p className="mt-1">Refrescar datos en Mac: <code className="px-1 py-0.5 bg-gray-800 rounded">python3 v3/sync.py</code></p>
              </div>
            </div>
            <div className="sticky bottom-0 bg-gray-900 px-5 py-3 border-t border-gray-800 flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded text-sm">Cancelar</button>
              <button onClick={apply} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm">Aplicar y recargar</button>
            </div>
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────────────────
    // Mount
    // ────────────────────────────────────────────────────────────────────────

    const root = createRoot(document.getElementById('root'));
    root.render(<ExpenseTrackerDashboard />);
  </script>
</body>
</html>
