    function SalaryView({ data }) {
      const slips = (data.payslips || []).slice().sort((a, b) => b.ym.localeCompare(a.ym));
      const people = [...new Set(slips.map((s) => s.person))];
      // Hooks must run before any early return, or the hook order changes
      // between renders once payslips start arriving.
      const [person, setPerson] = useState('');
      const active = person && people.includes(person) ? person : (people[0] || '');
      if (!slips.length) {
        return (
          <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 text-sm text-gray-400">
            Aún no hay nóminas registradas. Reenvía tus recibos de pago por correo
            y aparecerán aquí tras la próxima sync.
          </div>
        );
      }
      const mine = slips.filter((s) => s.person === active);
      const latest = mine[0];

      // Totals for the calendar year of the most recent payslip
      const year = latest.ym.slice(0, 4);
      const ytd = mine.filter((s) => s.ym.startsWith(year));
      const sum = (k) => ytd.reduce((a, s) => a + (s[k] || 0), 0);
      const ytdNet = sum('net'), ytdGross = sum('gross'), ytdTax = sum('tax');
      const effRate = ytdGross ? (ytdTax / ytdGross * 100) : 0;

      const chart = mine.slice().reverse().map((s) => ({
        month: s.ym, Neto: s.net, Retención: s.tax,
      }));

      return (
        <div className="space-y-6">
          {people.length > 1 && (
            <div className="flex gap-2">
              {people.map((p) => (
                <button key={p} onClick={() => setPerson(p)}
                  className={`px-3 py-1 rounded text-xs capitalize ${
                    p === active ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300'}`}>
                  {p}
                </button>
              ))}
            </div>
          )}

          {/* The three headline figures — latest payslip */}
          <section>
            <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">
              Último recibo — {latest.period}
              {latest.extraordinary && <span className="ml-2 text-amber-400">· mes extraordinario</span>}
            </h2>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div className="bg-gray-900 border border-blue-800/60 rounded-xl p-4">
                <div className="text-[10px] uppercase tracking-wide text-gray-400">Neto pagado</div>
                <div className="text-2xl font-semibold text-blue-300 mt-1">{fmtCOPfull(latest.net)}</div>
              </div>
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                <div className="text-[10px] uppercase tracking-wide text-gray-400">Salario bruto</div>
                <div className="text-2xl font-semibold mt-1">{fmtCOPfull(latest.gross)}</div>
              </div>
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                <div className="text-[10px] uppercase tracking-wide text-gray-400">Retención en la fuente</div>
                <div className="text-2xl font-semibold text-amber-300 mt-1">{fmtCOPfull(latest.tax)}</div>
                {latest.retention_pct != null && (
                  <div className="text-[10px] text-gray-500 mt-0.5">{latest.retention_pct}% aplicado</div>
                )}
              </div>
            </div>
          </section>

          <section>
            <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">
              Acumulado {year} ({ytd.length} {ytd.length === 1 ? 'mes' : 'meses'})
            </h2>
            <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
              <div><div className="text-[10px] text-gray-400 uppercase">Neto</div>
                   <div className="font-medium text-blue-300">{fmtCOPfull(ytdNet)}</div></div>
              <div><div className="text-[10px] text-gray-400 uppercase">Bruto</div>
                   <div className="font-medium">{fmtCOPfull(ytdGross)}</div></div>
              <div><div className="text-[10px] text-gray-400 uppercase">Impuestos</div>
                   <div className="font-medium text-amber-300">{fmtCOPfull(ytdTax)}</div></div>
              <div><div className="text-[10px] text-gray-400 uppercase">Tasa efectiva</div>
                   <div className="font-medium">{effRate.toFixed(1)}%</div></div>
            </div>
          </section>

          <section>
            <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Neto vs retención por mes</h2>
            <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
              <ResponsiveContainer width="100%" height={240}>
                <BarChart data={chart}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" vertical={false} />
                  <XAxis dataKey="month" stroke="#6b7280" fontSize={11} />
                  <YAxis stroke="#6b7280" fontSize={11} width={54} tickFormatter={(v) => fmtCOP(v)} />
                  <Tooltip contentStyle={{ backgroundColor: '#111827', border: '1px solid #1f2937', borderRadius: '0.5rem' }}
                           formatter={(v) => fmtCOPfull(v)} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  <Bar dataKey="Neto" stackId="a" fill="#60a5fa" isAnimationActive={false} />
                  <Bar dataKey="Retención" stackId="a" fill="#f59e0b" isAnimationActive={false} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </section>

          <section>
            <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Detalle por período</h2>
            <div className="bg-gray-900 border border-gray-800 rounded-xl overflow-x-auto">
              <table className="w-full text-xs">
                <thead className="bg-gray-800/60 text-gray-400">
                  <tr>
                    <th className="px-3 py-2 text-left">Período</th>
                    <th className="px-3 py-2 text-right">Bruto</th>
                    <th className="px-3 py-2 text-right">Retención</th>
                    <th className="px-3 py-2 text-right">Salud+Pensión</th>
                    <th className="px-3 py-2 text-right">Ahorro vol.</th>
                    <th className="px-3 py-2 text-right">Neto</th>
                  </tr>
                </thead>
                <tbody>
                  {mine.map((s) => (
                    <tr key={s.person + s.period} className="border-t border-gray-800">
                      <td className="px-3 py-2">
                        {s.period}
                        {s.extraordinary && <span className="ml-1 text-[9px] text-amber-400">extra</span>}
                      </td>
                      <td className="px-3 py-2 text-right">{fmtCOPfull(s.gross)}</td>
                      <td className="px-3 py-2 text-right text-amber-300">{fmtCOPfull(s.tax)}</td>
                      <td className="px-3 py-2 text-right text-gray-400">{fmtCOPfull(s.health + s.pension)}</td>
                      <td className="px-3 py-2 text-right text-gray-400">{fmtCOPfull(s.savings)}</td>
                      <td className="px-3 py-2 text-right font-medium text-blue-300">{fmtCOPfull(s.net)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      );
    }

                <tr>
                  <th className="text-left px-4 py-2">Categoría</th>
                  <th className="text-right px-4 py-2">Presupuesto</th>

    function AllTxsView({ data, onSelectTx }) {
      const [q, setQ] = useState('');
      const [parentFilter, setParentFilter] = useState('');
      const [showUncatOnly, setShowUncatOnly] = useState(false);
      const parents = (data.categories?.parents || []).map((p) => p.name);
      const filtered = useMemo(() => {
        const qLow = q.trim().toLowerCase();
        return data.transactions
          .filter((t) => {
            if (showUncatOnly && t.category_id) return false;
            if (parentFilter && t.parent !== parentFilter) return false;
            if (qLow && !(t.merchant?.toLowerCase().includes(qLow)
                || t.label?.toLowerCase().includes(qLow)
                || t.notes?.toLowerCase().includes(qLow))) return false;
            return true;
          })
          .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
      }, [data, q, parentFilter, showUncatOnly]);
      return (
        <section className="space-y-3">
          <div className="flex flex-col sm:flex-row gap-2">
            <div className="flex-1 relative">
              <Search size={14} className="absolute left-3 top-3 text-gray-500" />
              <input type="text" value={q} onChange={(e) => setQ(e.target.value)}
                placeholder="Buscar por comercio, categoría, notas…"
                className="w-full bg-gray-900 border border-gray-800 rounded pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-blue-500"/>
            </div>
            <select value={parentFilter} onChange={(e) => setParentFilter(e.target.value)}
              className="bg-gray-900 border border-gray-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
              <option value="">Todas las categorías</option>
              {parents.map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
            <label className="flex items-center gap-2 text-sm px-3 bg-gray-900 border border-gray-800 rounded">
              <input type="checkbox" checked={showUncatOnly} onChange={(e) => setShowUncatOnly(e.target.checked)} />
              Sin categoría
            </label>
          </div>
          <div className="text-xs text-gray-500">{filtered.length} transacciones</div>
          <div className="bg-gray-900 border border-gray-800 rounded-xl divide-y divide-gray-800">
            {filtered.slice(0, 300).map((t) => <TxRow key={t.id} tx={t} onClick={() => onSelectTx(t)} />)}
            {filtered.length > 300 && (
              <div className="px-4 py-3 text-xs text-gray-500 text-center">
                Mostrando las primeras 300 — refina la búsqueda para ver más.
              </div>
            )}
          </div>
        </section>
      );
    }

    function TxDetailDrawer({ tx, data, onClose, postEdit }) {
      const [editing, setEditing] = useState(false);
      const [path, setPath] = useState(tx.label || '');
      const [amount, setAmount] = useState(tx.amount);
      const [note, setNote] = useState(tx.notes || '');
      const [addedBy, setAddedBy] = useState(tx.added_by || '');
      const [tripId, setTripId] = useState(tx.trip_id != null ? String(tx.trip_id) : '');
      const [scope, setScope] = useState(tx.scope || '');
      const [submitting, setSubmitting] = useState(false);
      const tripOptions = useMemo(() => [
        { value: '', label: 'Ninguno (dashboard principal)' },
        ...(data.trips || []).map((t) => ({ value: String(t.id), label: `✈ ${t.name}` })),
      ], [data]);

      const allPaths = useMemo(() => {
        const out = new Set();
        const parents = data.categories?.parents || [];
        for (const p of parents) {
          out.add(p.name);
          for (const s of (p.subs || [])) out.add(`${p.name} / ${s.name}`);
        }
        return [...out].sort();
      }, [data]);

      const submit = async (kindAndExtra) => {
        setSubmitting(true);
        const ok = await postEdit({ ...kindAndExtra, tx_id: tx.id });
        setSubmitting(false);
        if (ok) { onClose(); }
      };

      const saveAll = async () => {
        // Send each change as its own edit (the queue applies them in order)
        if (path !== tx.label) {
          await submit({ kind: 'recategorize', path });
          return;
        }
        if (amount !== tx.amount) {
          await submit({ kind: 'edit_amount', amount: parseInt(amount, 10) });
          return;
        }
        if (note !== (tx.notes || '')) {
          await submit({ kind: 'edit_note', note });
          return;
        }
        if (addedBy !== (tx.added_by || '')) {
          await submit({ kind: 'tag', added_by: addedBy || null });
          return;
        }
        if (tripId !== (tx.trip_id != null ? String(tx.trip_id) : '')) {
          await submit({ kind: 'trip', trip_id: tripId === '' ? null : parseInt(tripId, 10) });
          return;
        }
        if (scope !== (tx.scope || '')) {
          await submit({ kind: 'scope', scope: scope || null });
          return;
        }
        setToast?.({ type: 'ok', text: 'No hay cambios' });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex" onClick={onClose}>
          <div className="flex-1 bg-black/50" />
          <div className="w-full sm:w-[28rem] bg-gray-900 border-l border-gray-800 overflow-y-auto"
               onClick={(e) => e.stopPropagation()}>
            <div className="sticky top-0 bg-gray-900 border-b border-gray-800 px-5 py-3 flex items-center justify-between">
              <h3 className="font-semibold text-sm">Transacción #{tx.id}</h3>
              <div className="flex items-center gap-2">
                <button onClick={() => setEditing(!editing)}
                        className={`text-xs px-2 py-1 rounded ${editing ? 'bg-gray-700' : 'bg-blue-700 hover:bg-blue-600'}`}>
                  {editing ? 'Cancelar' : 'Editar'}
                </button>
                <button onClick={onClose} className="text-gray-400 hover:text-white"><X size={18} /></button>
              </div>
            </div>

            <div className="p-4 space-y-3 text-sm">
              <DetailRow label="Comercio" value={tx.merchant} />
              {!editing && <DetailRow label="Monto"
                value={
                  tx.is_split && tx.split_owed >= tx.amount
                    ? <span><span className="line-through text-gray-500">{fmtCOPfull(tx.amount)}</span> <span className="ml-2 text-[10px] px-1.5 py-0.5 rounded bg-amber-900/50 border border-amber-800 text-amber-300">🚫 No fue mío</span></span>
                    : tx.is_split && tx.split_owed > 0
                      ? <span>{fmtCOPfull(tx.amount)} <span className="ml-2 text-[10px] text-amber-300">(mi parte: {fmtCOPfull(tx.amount - tx.split_owed)})</span></span>
                      : fmtCOPfull(tx.amount)
                } />}
              <DetailRow label="Fecha" value={tx.date + (tx.time ? ` ${tx.time}` : '')} />
              {!editing && <DetailRow label="Categoría"
                value={tx.category_id ? tx.label : <span className="text-amber-400">Sin categoría</span>} />}
              {!editing && <DetailRow label="Atribución"
                value={tx.added_by ? <span className="text-blue-300">{tx.added_by}</span> : <span className="text-gray-500">— (compartido / sin etiqueta)</span>} />}
              {!editing && (data.trips || []).length > 0 && <DetailRow label="Viaje"
                value={tx.trip_id
                  ? <span className="text-amber-300">✈ {tx.trip_name} <span className="text-gray-500 text-[10px]">({tx.trip_source === 'manual' ? 'a mano' : 'automático'})</span></span>
                  : <span className="text-gray-500">— (dashboard principal)</span>} />}
              {!editing && <DetailRow label="Ámbito"
                value={tx.scope
                  ? <span className="text-violet-300 capitalize">👤 Personal — {tx.scope}</span>
                  : <span className="text-gray-500">Hogar</span>} />}
              <DetailRow label="Origen" value={tx.source} />
              <DetailRow label="Pago" value={tx.payment_method || '—'} />
              {!editing && tx.notes && <DetailRow label="Notas" value={tx.notes} />}

              {editing && (
                <div className="mt-4 pt-4 border-t border-gray-800 space-y-3">
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400 block mb-1">Categoría</span>
                    <PathInput value={path} onChange={setPath} options={allPaths}
                               placeholder="Alimentación / Restaurantes" />
                  </label>

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400">Monto (COP)</span>
                    <input type="number" value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs" />
                  </label>

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400 block mb-1">Atribución</span>
                    <ChoiceSelect value={addedBy} onChange={setAddedBy}
                      options={[
                        { value: '',      label: '— (compartido / sin etiqueta)' },
                        { value: 'santi', label: 'Santi' },
                        { value: 'lau',   label: 'Lau' },
                      ]} />
                  </label>

                  {(data.trips || []).length > 0 && (
                    <label className="block">
                      <span className="text-[11px] uppercase tracking-wide text-gray-400 block mb-1">Viaje</span>
                      <ChoiceSelect value={tripId} onChange={setTripId} options={tripOptions} />
                    </label>
                  )}

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400 block mb-1">Ámbito (de quién es el gasto)</span>
                    <ChoiceSelect value={scope} onChange={setScope}
                      options={[
                        { value: '',      label: 'Hogar' },
                        { value: 'santi', label: 'Personal — Santi' },
                        { value: 'lau',   label: 'Personal — Lau' },
                      ]} />
                    {tx.trip_id && scope && (
                      <span className="text-[10px] text-amber-400/80 block mt-1">Este cargo está en un viaje: cuenta como viaje, no como personal.</span>
                    )}
                  </label>

                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-gray-400">Nota</span>
                    <input type="text" value={note} onChange={(e) => setNote(e.target.value)}
                      className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs" />
                  </label>

                  <button onClick={saveAll} disabled={submitting}
                    className="w-full px-3 py-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded text-sm font-medium">
                    {submitting ? 'Enviando…' : 'Guardar cambios'}
                  </button>

                  <div className="pt-3 border-t border-gray-800 grid grid-cols-2 gap-2">
                    <button onClick={() => submit({ kind: 'not_mine' })}
                            disabled={submitting}
                            className="px-3 py-2 bg-amber-900/40 hover:bg-amber-900/60 border border-amber-800 rounded text-xs">
                      🚫 No fue mío
                    </button>
                    <button onClick={() => {
                      const v = prompt('¿Cuánto me deben los demás? (COP)');
                      if (v) submit({ kind: 'split', split_owed: parseInt(v, 10) });
                    }}
                            disabled={submitting}
                            className="px-3 py-2 bg-amber-900/40 hover:bg-amber-900/60 border border-amber-800 rounded text-xs">
                      ➗ Split parcial
                    </button>
                    <button onClick={() => {
                      if (confirm('Borrar transacción (soft delete)?')) submit({ kind: 'delete' });
                    }}
                            disabled={submitting}
                            className="col-span-2 px-3 py-2 bg-red-900/40 hover:bg-red-900/60 border border-red-800 rounded text-xs">
                      🗑 Borrar
                    </button>
                  </div>
                </div>
              )}

              <div className="pt-3 mt-3 border-t border-gray-800">
                <p className="text-[10px] text-gray-500">
                  Los cambios se envían a Kikito (Worker en Cloudflare) y se aplican en la próxima sync.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function AddTxModal({ data, userIdentity, onClose, postEdit }) {
      const [kind, setKind] = useState('add_cash');  // or 'add_income'
      const [amount, setAmount] = useState('');
      const [path, setPath] = useState('');
      const [note, setNote] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const allPaths = useMemo(() => {
        const out = new Set();
        const parents = data.categories?.parents || [];
        for (const p of parents) {
          out.add(p.name);
          for (const s of (p.subs || [])) out.add(`${p.name} / ${s.name}`);
        }
        return [...out].sort();
      }, [data]);

      const submit = async () => {
        if (!amount || !path) return;
        setSubmitting(true);
        const ok = await postEdit({
          kind, amount: parseInt(amount, 10), path, note: note.trim(),
        });
        setSubmitting(false);
        if (ok) onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
          <div className="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-md" onClick={(e) => e.stopPropagation()}>
            <div className="px-5 py-3 border-b border-gray-800 flex items-center justify-between">
              <h3 className="font-semibold">Agregar transacción</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X size={18} /></button>
            </div>
            <div className="p-5 space-y-3 text-sm">
              <div className="flex gap-2">
                <button onClick={() => setKind('add_cash')}
                        className={`flex-1 py-2 rounded text-sm ${kind === 'add_cash' ? 'bg-blue-600' : 'bg-gray-800 hover:bg-gray-700'}`}>
                  💰 Cash (gasto)
                </button>
                <button onClick={() => setKind('add_income')}
                        className={`flex-1 py-2 rounded text-sm ${kind === 'add_income' ? 'bg-emerald-600' : 'bg-gray-800 hover:bg-gray-700'}`}>
                  📈 Ingreso
                </button>
              </div>

              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-gray-400">Monto (COP)</span>
                <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)}
                  placeholder="25000"
                  className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
              </label>

              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-gray-400 block mb-1">Categoría</span>
                <PathInput value={path} onChange={setPath} options={allPaths}
                           placeholder={kind === 'add_income' ? 'Salario' : 'Alimentación / Café'} />
              </label>

              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-gray-400">Nota (opcional)</span>
                <input type="text" value={note} onChange={(e) => setNote(e.target.value)}
                  placeholder="café con amiga"
                  className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm" />
              </label>

              <div className="text-[10px] text-gray-500">
                Se agregará a tu nombre ({userIdentity}). Se procesa en próxima sync.
              </div>
            </div>
            <div className="px-5 py-3 border-t border-gray-800 flex justify-end gap-2">
              <button onClick={onClose} className="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-sm">Cancelar</button>
              <button onClick={submit} disabled={submitting || !amount || !path}
                      className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 rounded text-sm font-medium">
                {submitting ? 'Enviando…' : 'Agregar'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DetailRow({ label, value }) {
      return (
        <div className="flex justify-between gap-4">
          <span className="text-gray-400 flex-shrink-0">{label}</span>
          <span className="text-right">{value}</span>
        </div>
      );
    }

    function SettingsPanel({
      url, setUrl, token, setToken,
      workerUrl, setWorkerUrl, workerSecret, setWorkerSecret,
      userIdentity, setUserIdentity,
      onClose, onApply,
    }) {
      const [u, setU] = useState(url);
      const [t, setT] = useState(token);
      const [wU, setWU] = useState(workerUrl);
      const [wS, setWS] = useState(workerSecret);
      const [uid, setUid] = useState(userIdentity);
      const [showToken, setShowToken] = useState(false);
      const [showSecret, setShowSecret] = useState(false);
      const apply = () => {
        setUrl(u); setToken(t); setWorkerUrl(wU); setWorkerSecret(wS); setUserIdentity(uid);
        onApply(); onClose();
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={onClose}>
          <div className="bg-gray-900 border border-gray-800 rounded-xl w-full max-w-md max-h-[90vh] overflow-y-auto"
               onClick={(e) => e.stopPropagation()}>
            <div className="sticky top-0 bg-gray-900 px-5 py-3 border-b border-gray-800 flex items-center justify-between">
              <h3 className="font-semibold">Configuración</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><X size={18} /></button>
            </div>
            <div className="p-5 space-y-4 text-sm">
              <div className="pb-2 border-b border-gray-800">
                <h4 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Identidad</h4>
                <label className="block">
                  <span className="text-xs text-gray-400">¿Quién eres?</span>
                  <select value={uid} onChange={(e) => setUid(e.target.value)}
                    className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
                    <option value="santi">Santi</option>
                    <option value="lau">Lau</option>
                  </select>
                  <span className="text-[10px] text-gray-500 block mt-1">
                    Cada edición que envíes desde este navegador queda atribuida a ti.
                  </span>
                </label>
              </div>

              <div className="pb-2 border-b border-gray-800">
                <h4 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Datos (lectura)</h4>
                <label className="block">
                  <span className="text-xs text-gray-400">URL del snapshot</span>
                  <input type="text" value={u} onChange={(e) => setU(e.target.value)}
                    className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                </label>
                <label className="block mt-2">
                  <span className="text-xs text-gray-400">Token GitHub (read-only)</span>
                  <div className="flex gap-2 mt-1">
                    <input type={showToken ? 'text' : 'password'} value={t} onChange={(e) => setT(e.target.value)}
                      placeholder="github_pat_..."
                      className="flex-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                    <button onClick={() => setShowToken(!showToken)}
                            className="px-2 bg-gray-800 border border-gray-700 rounded text-xs">
                      {showToken ? '🙈' : '👁'}
                    </button>
                  </div>
                </label>
              </div>

              <div className="pb-2">
                <h4 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Edición (escritura)</h4>
                <label className="block">
                  <span className="text-xs text-gray-400">URL del Worker (Kikito)</span>
                  <input type="text" value={wU} onChange={(e) => setWU(e.target.value)}
                    className="w-full mt-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                </label>
                <label className="block mt-2">
                  <span className="text-xs text-gray-400">Secret del Worker (DASHBOARD_SECRET)</span>
                  <div className="flex gap-2 mt-1">
                    <input type={showSecret ? 'text' : 'password'} value={wS} onChange={(e) => setWS(e.target.value)}
                      placeholder="el mismo que está en Cloudflare"
                      className="flex-1 bg-gray-800 border border-gray-700 rounded px-3 py-2 text-xs font-mono"/>
                    <button onClick={() => setShowSecret(!showSecret)}
                            className="px-2 bg-gray-800 border border-gray-700 rounded text-xs">
                      {showSecret ? '🙈' : '👁'}
                    </button>
                  </div>
                  <span className="text-[10px] text-gray-500 block mt-1">
                    Sin esto, los botones de Editar / Agregar no funcionarán.
                  </span>
                </label>
              </div>

              <div className="text-[10px] text-gray-500 pt-2 border-t border-gray-800">
                <p>Auto-refresh: cada {AUTO_REFRESH_MIN} minutos.</p>
                <p className="mt-1">Refrescar datos en Mac: <code className="px-1 py-0.5 bg-gray-800 rounded">python3 v3/sync.py</code></p>
              </div>
            </div>
            <div className="sticky bottom-0 bg-gray-900 px-5 py-3 border-t border-gray-800 flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded text-sm">Cancelar</button>
              <button onClick={apply} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm">Aplicar y recargar</button>
            </div>
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────────────────
    // Mount
    // ────────────────────────────────────────────────────────────────────────

    const root = createRoot(document.getElementById('root'));
    root.render(<ExpenseTrackerDashboard />);
  </script>
</body>
</html>
