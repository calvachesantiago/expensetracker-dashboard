<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { background: #030712; color: #f3f4f6; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .loading-shell { padding: 2rem; color: #9ca3af; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.3.1",
      "lucide-react": "https://esm.sh/lucide-react@0.428.0?deps=react@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div class="loading-shell">Cargando ExpenseTracker… (esto carga React + Tailwind desde CDN la primera vez)</div>
  </div>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      BarChart, Bar, ResponsiveContainer, CartesianGrid, XAxis, YAxis,
      Tooltip, Legend, Cell, LineChart, Line, ReferenceLine,
      LabelList,
    } from 'recharts';
    import {
      Calendar, RefreshCw, Settings, AlertTriangle, ChevronRight, X,
      TrendingUp, TrendingDown, Search, AlertCircle, Plus, Edit2, Trash2,
    } from 'lucide-react';

    // ────────────────────────────────────────────────────────────────────────
    // Config
    // ────────────────────────────────────────────────────────────────────────

    // Use the GitHub Contents API (NOT raw.githubusercontent.com). The raw
    // host rejects CORS preflight when an Authorization header is involved,
    // so browsers block the fetch. api.github.com has proper CORS for
    // authenticated requests and returns the raw content when we send the
    // Accept: application/vnd.github.raw header.
    const DEFAULT_URL = 'https://api.github.com/repos/calvachesantiago/expensetracker-snapshots/contents/dashboard_snapshot.json';
    const DEFAULT_WORKER_URL = 'https://kikito.calvachesantiago.workers.dev';
    const AUTO_REFRESH_MIN = 5;
    const INCOME_CATS = new Set(['Salario', 'Ingresos extras', 'Reembolsos', 'Otros ingresos']);
    const PARENT_COLORS = [
      '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4',
      '#ec4899', '#f97316', '#84cc16', '#a78bfa', '#22d3ee', '#fb7185',
    ];

    const fmtCOP = (n) => {
      if (n === null || n === undefined || isNaN(n)) return '—';
      const abs = Math.abs(n);
      if (abs >= 1_000_000) return `${(n / 1_000_000).toFixed(2)}M`;
      if (abs >= 1_000) return `${(n / 1_000).toFixed(0)}k`;
      return n.toLocaleString('es-CO');
    };
    const fmtCOPfull = (n) => {
      if (n === null || n === undefined || isNaN(n)) return '—';
      return `COP ${Math.round(n).toLocaleString('es-CO')}`;
    };
    const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);

    // Pace-aware bar color for KPI cards ("am I ahead of the month?")
    const budgetColor = (spendPct, daysPct) => {
      if (spendPct >= 100) return 'bg-red-500';
      const over = spendPct - daysPct;
      if (over > 30) return 'bg-red-500';
      if (over > 10) return 'bg-amber-500';
      return 'bg-emerald-500';
    };

    // %-only bar color for the per-category Budget vs Actual table.
    // Traffic-light progression: green → yellow → orange → red.
    const categoryBudgetColor = (spendPct) => {
      if (spendPct >= 100) return 'bg-red-500';
      if (spendPct >= 85)  return 'bg-orange-500';
      if (spendPct >= 70)  return 'bg-yellow-500';
      return 'bg-emerald-500';
    };
    // Matching text colors so the "%" label always agrees with the bar
    const categoryBudgetTextColor = (spendPct) => {
      if (spendPct >= 100) return 'text-red-400';
      if (spendPct >= 85)  return 'text-orange-400';
      if (spendPct >= 70)  return 'text-yellow-400';
      return 'text-emerald-400';
    };

    // ────────────────────────────────────────────────────────────────────────
    // Data hook
    // ────────────────────────────────────────────────────────────────────────

    function useSnapshot(url, token) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastFetched, setLastFetched] = useState(null);

      const fetchData = useCallback(async () => {
        setLoading(true); setError(null);
        try {
          const headers = { Accept: 'application/vnd.github.raw' };
          if (token) headers.Authorization = `Bearer ${token}`;
          const res = await fetch(url, { headers, cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
          const json = await res.json();
          setData(json); setLastFetched(new Date());
          try { localStorage.setItem('et-cache', JSON.stringify(json)); } catch {}
        } catch (e) {
          try {
            const cached = localStorage.getItem('et-cache');
            if (cached) {
              setData(JSON.parse(cached));
              setError(`Live fetch failed (${e.message}); mostrando copia cacheada.`);
            } else {
              setError(e.message);
            }
          } catch { setError(e.message); }
        } finally { setLoading(false); }
      }, [url, token]);

      useEffect(() => { fetchData(); }, [fetchData]);
      useEffect(() => {
        const t = setInterval(fetchData, AUTO_REFRESH_MIN * 60 * 1000);
        return () => clearInterval(t);
      }, [fetchData]);

      return { data, loading, error, lastFetched, refetch: fetchData };
    }

    // ────────────────────────────────────────────────────────────────────────
    // Computations
    // ────────────────────────────────────────────────────────────────────────

    function lastNMonths(monthsList, n, anchor) {
      const idx = monthsList.indexOf(anchor);
      const end = idx >= 0 ? idx + 1 : monthsList.length;
      return monthsList.slice(Math.max(0, end - n), end);
    }

    // Trip spend, to ADD BACK wherever it's the bank balance that matters (cash
    // flow, balance, savings). When the snapshot excludes trips from its spending
    // aggregates they vanish from every spending view — the money is gone either
    // way, so the balance must still count it. Zero if the snapshot isn't excluding.
    function tripAddBack(data, ym) {
      return data.trips_excluded ? ((data.monthly_trip || {})[ym] || 0) : 0;
    }
    // Same contract for spending from each person's OWN money (scope santi / lau):
    // out of the household views when the snapshot excludes it, but never out of
    // the balance. The export counts a charge in at most one bucket, so adding
    // trips + personal back can't double count.
    function personalAddBack(data, ym) {
      if (!data.personal_excluded) return 0;
      return Object.values(data.monthly_personal || {}).reduce((s, byM) => s + (byM[ym] || 0), 0);
    }

    // How much personal money LEAVES THE HOUSEHOLD BALANCE in a month.
    //
    // The allowance is gone from the household the moment each person keeps it:
    // income 100, each keeps 10 → 20 has left, whatever either does with it. So the
    // balance deducts the ALLOWANCE (2 × % × household base income), never the
    // personal charges that happen to be tagged — Lau may spend hers on accounts
    // this tracker never sees, so the tagged amount is always incomplete. Tags are
    // informational (how the allowance was used) and are never deducted a second
    // time; overspending is flagged in the Personal tab, not deducted here.
    //
    // It only applies from `household_since` (default Nov 2026) so moving the
    // slider can't rewrite months before the arrangement existed. Where it can't
    // apply (no % saved yet, before the start month, or a month with no income to
    // take a % of) we fall back to the tagged personal spend, so nothing that left
    // the household views silently disappears from the balance.
    const ymNum = (ym) => parseInt(String(ym).replace('-', ''), 10);
    function householdBaseIncome(data, ym) {
      return (data.income_transactions || [])
        .filter((t) => t.ym === ym && t.parent !== 'Ingresos extras')
        .reduce((s, t) => s + t.amount, 0);
    }
    function personalOutflow(data, ym) {
      if (!data.personal_excluded) return { amount: 0, mode: 'none' };   // already inside the household totals
      const tagged = personalAddBack(data, ym);
      const pct = data.settings?.allowance_pct?.value;
      const since = data.settings?.household_since?.value ?? 202611;
      const income = householdBaseIncome(data, ym);
      if (pct === undefined || ymNum(ym) < since || income <= 0) return { amount: tagged, mode: 'tagged' };
      return { amount: Math.round(2 * (pct / 100) * income), mode: 'allowance' };
    }

    // Edits queued in the Worker but not yet applied by a Sync: { tx_id: [kinds] }.
    const PendingContext = React.createContext({});

    function computeMonthStats(data, month) {
      const budgets = data.suggested_budgets || {};
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));

      let spendTotal = 0, budgetTotal = 0;
      const budgetRows = [];
      for (const p of parents) {
        const spend = (data.monthly_by_parent[p.name] || {})[month] || 0;
        const budget = (budgets[p.name]?.suggested_budget) || 0;
        spendTotal += spend; budgetTotal += budget;
        if (spend > 0 || budget > 0) budgetRows.push({ name: p.name, spend, budget });
      }
      // Uncategorized: counted in the total spend, but NOT shown in the
      // budget-vs-actual table (would be duplicate noise — the count is
      // already surfaced in "Necesita atención").
      const uncat = (data.monthly_by_parent[''] || {})[month] || 0;
      if (uncat > 0) spendTotal += uncat;

      // Sort by budget size (largest first). Ties broken by spend (largest first)
      // so categories without a budget but with real spend still sink, not float.
      budgetRows.sort((a, b) => (b.budget - a.budget) || (b.spend - a.spend));
      // Income lives in its own snapshot key — `transactions` is expenses-only
      // (merging them would make every spend aggregate count salary as spend).
      const income = (data.income_transactions || [])
        .filter((t) => t.ym === month)
        .reduce((s, t) => s + t.amount, 0);

      const [y, m] = month.split('-').map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();
      const today = new Date();
      const isCurrent = today.getFullYear() === y && today.getMonth() + 1 === m;
      const dayOfMonth = isCurrent ? today.getDate() : daysInMonth;
      const daysPct = Math.round((dayOfMonth / daysInMonth) * 100);
      // Only variable spend gets extrapolated. Fixed costs (arriendo, empleada,
      // servicios — whether already imported from Nu or still estimated) are
      // paid once a month, so treating them as a daily run-rate would badly
      // overstate the projection.
      const fixed = (data.monthly_fixed || {})[month] || 0;
      const variable = Math.max(0, spendTotal - fixed);
      const projected = isCurrent && dayOfMonth > 0
        ? Math.round(fixed + (variable / dayOfMonth) * daysInMonth) : spendTotal;

      // "Am I on pace?" must compare VARIABLE spend against VARIABLE budget.
      // Fixed costs are paid in full in the first days (arriendo on the 5th),
      // so including them makes the month look overspent from day 5 onward —
      // it flipped a genuinely on-track month from 64% to 76% at 68% elapsed
      // without any change in discretionary spending.
      const variableBudget = Math.max(0, budgetTotal - fixed);
      const pacePct = variableBudget > 0
        ? Math.round((variable / variableBudget) * 100) : 0;

      const tripSpend = tripAddBack(data, month);
      const po = personalOutflow(data, month);
      const personalSpend = po.amount, personalMode = po.mode;
      return { month, spendTotal, budgetTotal, income, tripSpend, personalSpend, personalMode,
               net: income - spendTotal - tripSpend - personalSpend,
               daysInMonth, dayOfMonth, daysPct, projected, budgetRows,
               fixed, variable, variableBudget, pacePct };
    }

    function computeYearStats(data, month) {
      const year = month.slice(0, 4);
      const monthsInYear = data.months.filter((m) => m.startsWith(year));
      const budgets = data.suggested_budgets || {};
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));
      let yearSpend = 0, yearBudget = 0;
      for (const p of parents) {
        yearBudget += ((budgets[p.name]?.suggested_budget) || 0) * 12;
        for (const m of monthsInYear) yearSpend += (data.monthly_by_parent[p.name] || {})[m] || 0;
      }
      for (const m of monthsInYear) yearSpend += (data.monthly_by_parent[''] || {})[m] || 0;
      const today = new Date();
      const cy = today.getFullYear();
      let elapsedPct;
      if (parseInt(year) < cy) elapsedPct = 100;
      else if (parseInt(year) > cy) elapsedPct = 0;
      else {
        const start = new Date(cy, 0, 1);
        elapsedPct = Math.round((((today - start) / (1000 * 60 * 60 * 24)) / 365) * 100);
      }
      return { year, yearSpend, yearBudget, elapsedPct };
    }

    function computeAttention(data, month) {
      // Categorization items (the main "needs attention" pile)
      const categorization = [];
      const uncat = data.transactions.filter((t) => !t.category_id && t.source !== 'Form (Drive)');
      if (uncat.length > 0) {
        const rappiRows = uncat.filter((t) => t.merchant?.toUpperCase().includes('RAPPI'));
        const real = uncat.length - rappiRows.length;
        // A Rappi receipt arrives within ~a day of the order. If none has
        // matched after the grace window, the charge predates the receipt
        // parser (or never got a receipt) — it needs categorizing by hand
        // rather than "waiting" on anything.
        const RAPPI_GRACE_DAYS = 7;
        const cutoff = new Date(Date.now() - RAPPI_GRACE_DAYS * 864e5).toISOString().slice(0, 10);
        const rappiPending = rappiRows.filter((t) => t.date > cutoff).length;
        const rappiManual = rappiRows.length - rappiPending;

        if (real > 0) categorization.push({ severity: 'warn',
          text: `${real} transacciones necesitan categoría`,
          sub: 'Tócalas para editar, o dile a Kikito en Telegram' });
        if (rappiManual > 0) categorization.push({ severity: 'warn',
          text: `${rappiManual} Rappi sin recibo — categoría manual`,
          sub: 'Anteriores al parser de recibos; no llegará recibo' });
        if (rappiPending > 0) categorization.push({ severity: 'info',
          text: `${rappiPending} Rappi con recibo pendiente`,
          sub: 'Se categorizan solas cuando llegue el recibo' });
      }

      // Budget overages (rendered as a smaller, secondary list)
      const overBudget = [];
      const budgets = data.suggested_budgets || {};
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));
      for (const p of parents) {
        const spend = (data.monthly_by_parent[p.name] || {})[month] || 0;
        const budget = (budgets[p.name]?.suggested_budget) || 0;
        if (budget > 0 && spend / budget >= 1.0) {
          overBudget.push({
            name: p.name, pct: pct(spend, budget),
            spend, budget,
          });
        }
      }
      overBudget.sort((a, b) => b.pct - a.pct);

      return { categorization, overBudget };
    }

    // ────────────────────────────────────────────────────────────────────────
    // App
    // ────────────────────────────────────────────────────────────────────────

    function ExpenseTrackerDashboard() {
      const [url, setUrl] = useState(() => localStorage.getItem('et-url') || DEFAULT_URL);
      const [token, setToken] = useState(() => localStorage.getItem('et-token') || '');
      const [workerUrl, setWorkerUrl] = useState(() => localStorage.getItem('et-worker-url') || DEFAULT_WORKER_URL);
      const [workerSecret, setWorkerSecret] = useState(() => localStorage.getItem('et-worker-secret') || '');
      const [userIdentity, setUserIdentity] = useState(() => localStorage.getItem('et-user') || 'santi');
      const [showSettings, setShowSettings] = useState(false);
      const [showAddTx, setShowAddTx] = useState(false);
      const [tab, setTab] = useState('home');
      const [month, setMonth] = useState(null);
      const [selectedTx, setSelectedTx] = useState(null);
      const [toast, setToast] = useState(null);

      const { data, loading, error, lastFetched, refetch } = useSnapshot(url, token);

      // Edits waiting for the next Sync, so a row can say "⏳ pendiente" instead of
      // looking like nothing happened (which invites sending the same edit twice).
      const [pending, setPending] = useState({});
      const loadPending = useCallback(async () => {
        if (!workerSecret) { setPending({}); return; }
        try {
          const res = await fetch(`${workerUrl}/queue`, { headers: { 'Authorization': `Bearer ${workerSecret}` } });
          if (!res.ok) return;
          const j = await res.json();
          const m = {};
          for (const it of (j.edits || [])) {
            const id = it.edit && it.edit.tx_id;
            if (id != null) (m[id] = m[id] || []).push(it.edit.kind);
            // a queued setting has no transaction: key it by name so its slider can say "en cola"
            if (it.edit && it.edit.kind === 'setting') m[`setting:${it.edit.key}`] = it.edit.value;
          }
          setPending(m);
        } catch (_) { /* offline: just don't show badges */ }
      }, [workerUrl, workerSecret]);

      // Helper: POST an edit to the Worker
      const postEdit = useCallback(async (edit) => {
        if (!workerSecret) {
          setToast({ type: 'error', text: 'Configura el secret del Worker en ⚙' });
          return false;
        }
        try {
          const fullEdit = { ...edit, by_user: userIdentity };
          const res = await fetch(`${workerUrl}/edit`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${workerSecret}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(fullEdit),
          });
          if (!res.ok) {
            const txt = await res.text();
            setToast({ type: 'error', text: `Error ${res.status}: ${txt.slice(0, 80)}` });
            return false;
          }
          setToast({ type: 'ok', text: '✅ En cola — se aplica en próxima sync' });
          loadPending();
          return true;
        } catch (e) {
          setToast({ type: 'error', text: `Error de red: ${e.message}` });
          return false;
        }
      }, [workerUrl, workerSecret, userIdentity, loadPending]);

      useEffect(() => { loadPending(); }, [loadPending, data]);

      useEffect(() => {
        if (data?.summary?.current_month && !month) setMonth(data.summary.current_month);
      }, [data, month]);

      useEffect(() => {
        if (error && /401|403/.test(error) && !token) setShowSettings(true);
      }, [error, token]);

      if (loading && !data) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-gray-400 flex items-center gap-2">
              <RefreshCw className="animate-spin" size={20} /> Cargando snapshot…
            </div>
          </div>
        );
      }
      if (!data && error) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="max-w-md bg-red-950/40 border border-red-900 rounded-xl p-6">
              <AlertCircle size={32} className="text-red-400 mb-3" />
              <h2 className="text-lg font-semibold mb-2">No pude cargar los datos</h2>
              <p className="text-sm text-red-300 mb-4">{error}</p>
              <button onClick={() => setShowSettings(true)}
                      className="px-4 py-2 bg-red-900/50 hover:bg-red-900 rounded text-sm">
                Configurar URL + token
              </button>
            </div>
            {showSettings && (
              <SettingsPanel url={url} setUrl={(u) => { setUrl(u); localStorage.setItem('et-url', u); }}
                token={token} setToken={(t) => { setToken(t); localStorage.setItem('et-token', t); }}
                onClose={() => setShowSettings(false)} onApply={refetch} />
            )}
          </div>
        );
      }

      return (
        <PendingContext.Provider value={pending}>
        <div className="min-h-screen">
          <Header data={data} month={month} setMonth={setMonth}
            lastFetched={lastFetched} loading={loading}
            onRefresh={refetch} onOpenSettings={() => setShowSettings(true)}
            onAddTx={() => setShowAddTx(true)} />
          <Tabs tab={tab} setTab={setTab} />
          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 pb-24">
            {error && (
              <div className="mb-4 px-4 py-2 bg-amber-950/40 border border-amber-900 rounded text-sm text-amber-300 flex items-center gap-2">
                <AlertTriangle size={14} /> {error}
              </div>
            )}
            {tab === 'home' && <HomeView data={data} month={month} onSelectTx={setSelectedTx} />}
            {tab === 'trends' && <TrendsView data={data} month={month} />}
            {tab === 'trips' && <TripsView data={data} onSelectTx={setSelectedTx} postEdit={postEdit} />}
            {tab === 'personal' && <PersonalView data={data} month={month} onSelectTx={setSelectedTx} postEdit={postEdit} userIdentity={userIdentity} />}
            {tab === 'budgets' && <BudgetsView data={data} />}
            {tab === 'salary' && <SalaryView data={data} />}
            {tab === 'all' && <AllTxsView data={data} onSelectTx={setSelectedTx} />}
          </main>
          {selectedTx && (
            <TxDetailDrawer
              tx={selectedTx} data={data}
              onClose={() => setSelectedTx(null)}
              postEdit={postEdit}
            />
          )}
          {showAddTx && (
            <AddTxModal data={data} userIdentity={userIdentity}
              onClose={() => setShowAddTx(false)} postEdit={postEdit} />
          )}
          {showSettings && (
            <SettingsPanel
              url={url} setUrl={(u) => { setUrl(u); localStorage.setItem('et-url', u); }}
              token={token} setToken={(t) => { setToken(t); localStorage.setItem('et-token', t); }}
              workerUrl={workerUrl} setWorkerUrl={(u) => { setWorkerUrl(u); localStorage.setItem('et-worker-url', u); }}
              workerSecret={workerSecret} setWorkerSecret={(s) => { setWorkerSecret(s); localStorage.setItem('et-worker-secret', s); }}
              userIdentity={userIdentity} setUserIdentity={(u) => { setUserIdentity(u); localStorage.setItem('et-user', u); }}
              onClose={() => setShowSettings(false)} onApply={refetch} />
          )}
          {toast && <Toast toast={toast} onDismiss={() => setToast(null)} />}
        </div>
        </PendingContext.Provider>
      );
    }

    function PathInput({ value, onChange, options, placeholder }) {
      const [open, setOpen] = useState(false);
      const v = value || '';
      const filtered = useMemo(() => {
        const q = v.toLowerCase();
        if (!q) return options.slice(0, 10);
        return options.filter(o => o.toLowerCase().includes(q)).slice(0, 10);
      }, [v, options]);
      return (
        <div className="relative">
          <input type="text" value={v}
            onChange={(e) => { onChange(e.target.value); setOpen(true); }}
            onFocus={() => setOpen(true)}
            onBlur={() => setTimeout(() => setOpen(false), 200)}
            placeholder={placeholder}
            className="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs focus:outline-none focus:border-blue-500" />
          {open && filtered.length > 0 && (
            <ul className="absolute z-50 top-full left-0 right-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg max-h-56 overflow-y-auto">
              {filtered.map(opt => (
                <li key={opt}
                    onMouseDown={(e) => { e.preventDefault(); onChange(opt); setOpen(false); }}
                    className="px-3 py-1.5 text-xs text-gray-200 hover:bg-blue-700 hover:text-white cursor-pointer border-b border-gray-700 last:border-b-0">
                  {opt}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    function ChoiceSelect({ value, onChange, options, placeholder }) {
      const [open, setOpen] = useState(false);
      const selected = options.find(o => o.value === (value || ''));
      const displayLabel = selected ? selected.label : (placeholder || '—');
      return (
        <div className="relative">
          <button type="button"
            onClick={() => setOpen(o => !o)}
            onBlur={() => setTimeout(() => setOpen(false), 200)}
            className="w-full text-left bg-gray-800 border border-gray-700 rounded px-2 py-1.5 text-xs focus:outline-none focus:border-blue-500 flex items-center justify-between">
            <span className={selected && selected.value ? 'text-gray-200' : 'text-gray-500'}>{displayLabel}</span>
            <span className="text-gray-500 ml-2">▾</span>
          </button>
          {open && (
            <ul className="absolute z-50 top-full left-0 right-0 mt-1 bg-gray-800 border border-gray-700 rounded shadow-lg max-h-56 overflow-y-auto">
              {options.map(opt => (
                <li key={opt.value}
                    onMouseDown={(e) => { e.preventDefault(); onChange(opt.value); setOpen(false); }}
                    className="px-3 py-1.5 text-xs text-gray-200 hover:bg-blue-700 hover:text-white cursor-pointer border-b border-gray-700 last:border-b-0">
                  {opt.label}
                </li>
              ))}
            </ul>
          )}
        </div>
      );
    }

    function Toast({ toast, onDismiss }) {
      useEffect(() => {
        const t = setTimeout(onDismiss, 4000);
        return () => clearTimeout(t);
      }, [onDismiss]);
      const bg = toast.type === 'ok' ? 'bg-emerald-700 border-emerald-600' : 'bg-red-800 border-red-700';
      return (
        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 ${bg} border rounded-lg px-4 py-2 text-sm shadow-lg max-w-md`}>
          {toast.text}
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────────────────
    // Sub-components
    // ────────────────────────────────────────────────────────────────────────

    function Header({ data, month, setMonth, lastFetched, loading, onRefresh, onOpenSettings, onAddTx }) {
      const months = data?.months || [];
      const minutesAgo = lastFetched ? Math.floor((Date.now() - lastFetched.getTime()) / 60000) : null;
      return (
        <header className="sticky top-0 z-30 bg-gray-950/95 backdrop-blur border-b border-gray-800">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-2 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <h1 className="text-base font-bold">ExpenseTracker</h1>
              <span className="hidden sm:block text-[10px] text-gray-500">
                {data?.summary?.first_month} → {data?.summary?.last_month}
              </span>
            </div>
            <div className="flex items-center gap-2">
              <select value={month || ''} onChange={(e) => setMonth(e.target.value)}
                className="bg-gray-900 border border-gray-800 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500">
                {[...months].reverse().map((m) => <option key={m} value={m}>{m}</option>)}
              </select>
              <button onClick={onAddTx}
                className="flex items-center gap-1 px-2 py-1 bg-blue-700 hover:bg-blue-600 border border-blue-600 rounded text-xs font-medium"
                title="Agregar cash o ingreso">
                <Plus size={12} />
                <span className="hidden sm:inline">Agregar</span>
              </button>
              <button onClick={onRefresh} disabled={loading}
                className="flex items-center gap-1 px-2 py-1 bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded text-xs"
                title={lastFetched ? `Última carga: ${lastFetched.toLocaleString()}` : 'Recargar'}>
                <RefreshCw size={12} className={loading ? 'animate-spin' : ''} />
                <span className="hidden sm:inline">
                  {minutesAgo === null ? 'Cargar' : minutesAgo < 1 ? 'ahora' : `${minutesAgo}m`}
                </span>
              </button>
              <button onClick={onOpenSettings} className="p-1 hover:bg-gray-900 rounded" title="Configuración">
                <Settings size={16} className="text-gray-400" />
              </button>
            </div>
          </div>
        </header>
      );
    }

    function Tabs({ tab, setTab }) {
      const tabs = [
        { id: 'home', label: 'Inicio' },
        { id: 'trends', label: 'Tendencias' },
        { id: 'trips', label: 'Viajes' },
        { id: 'personal', label: 'Personal' },
        { id: 'budgets', label: 'Presupuestos' },
        { id: 'salary', label: 'Salario' },
        { id: 'all', label: 'Todas las transacciones' },
      ];
      return (
        <nav className="border-b border-gray-800 bg-gray-950/80">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 flex gap-4 overflow-x-auto">
            {tabs.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`py-3 text-sm whitespace-nowrap border-b-2 transition-colors ${
                  tab === t.id ? 'border-blue-500 text-blue-400'
                              : 'border-transparent text-gray-400 hover:text-gray-200'}`}>
                {t.label}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    function HomeView({ data, month, onSelectTx }) {
      if (!month) return null;
      const stats = useMemo(() => computeMonthStats(data, month), [data, month]);
      const yearStats = useMemo(() => computeYearStats(data, month), [data, month]);
      const attention = useMemo(() => computeAttention(data, month), [data, month]);
      return (
        <div className="space-y-4">
          <KPICards stats={stats} yearStats={yearStats} month={month} />
          {attention.categorization.length > 0 && <NeedsAttention items={attention.categorization} />}
          {attention.overBudget.length > 0 && <OverBudgetMini items={attention.overBudget} month={month} />}
          <BudgetTable rows={stats.budgetRows} data={data} month={month} />
          <RecentActivity data={data} onSelectTx={onSelectTx} />
        </div>
      );
    }

    function OverBudgetMini({ items, month }) {
      return (
        <section>
          <h2 className="text-xs uppercase tracking-wide text-gray-500 mb-2">
            Por encima del presupuesto en {month}
          </h2>
          <div className="bg-gray-900/60 border border-gray-800 rounded-lg px-3 py-2 flex flex-wrap gap-x-4 gap-y-1 text-xs">
            {items.map((it) => (
              <span key={it.name} className="text-gray-400">
                <span className="text-gray-200">{it.name}</span>
                {' '}
                <span className={it.pct >= 200 ? 'text-red-400' : 'text-amber-400'}>
                  {it.pct}%
                </span>
                {' '}
                <span className="text-gray-500">({fmtCOPfull(it.spend)} / {fmtCOPfull(it.budget)})</span>
              </span>
            ))}
          </div>
        </section>
      );
    }

    function KPICards({ stats, yearStats, month }) {
      const monthPct = pct(stats.spendTotal, stats.budgetTotal);
      const yearPct = pct(yearStats.yearSpend, yearStats.yearBudget);
      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {/* Progress + colour track the VARIABLE budget: fixed costs are paid
              in full in the first days, so including them would show the month
              as overspent from day 5 on. The headline still shows the true
              total, with the fixed share spelled out in the footer. */}
          <KPICard title={`Este mes — ${month}`} primary={fmtCOPfull(stats.spendTotal)}
            secondary={`de ${fmtCOPfull(stats.budgetTotal)} · ${monthPct}%`}
            progress={Math.min(stats.pacePct, 200)}
            color={budgetColor(stats.pacePct, stats.daysPct)}
            footer={stats.dayOfMonth < stats.daysInMonth
              ? `Día ${stats.dayOfMonth} de ${stats.daysInMonth} (${stats.daysPct}%) · `
                + `variable ${stats.pacePct}% · Proyección: ${fmtCOPfull(stats.projected)}`
              : `Mes cerrado`}
            note={stats.fixed > 0
              ? `Incluye ${fmtCOPfull(stats.fixed)} de gastos fijos`
              : null} />
          <KPICard title={`Este año — ${yearStats.year}`} primary={fmtCOPfull(yearStats.yearSpend)}
            secondary={`de ${fmtCOPfull(yearStats.yearBudget)} · ${yearPct}%`}
            progress={Math.min(yearPct, 100)}
            color={budgetColor(yearPct, yearStats.elapsedPct)}
            footer={`${yearStats.elapsedPct}% del año transcurrido`} />
          <KPICard title="Flujo de caja del mes" primary={fmtCOPfull(stats.net)}
            secondary={`Ingresos ${fmtCOPfull(stats.income)} − Gastos ${fmtCOPfull(stats.spendTotal + stats.tripSpend + stats.personalSpend)}`}
            note={(() => {
              const bits = [stats.tripSpend > 0 && `viajes ${fmtCOPfull(stats.tripSpend)}`,
                            stats.personalSpend > 0 && `${stats.personalMode === 'allowance' ? 'allowances' : 'personal'} ${fmtCOPfull(stats.personalSpend)}`].filter(Boolean);
              return bits.length ? 'Incluye ' + bits.join(' · ') : null;
            })()}
            progress={null}
            color={stats.net >= 0 ? 'bg-emerald-500' : 'bg-red-500'}
            footer={stats.net >= 0 ? '✓ En positivo' : '⚠ Gastos > ingresos'}
            icon={stats.net >= 0 ? <TrendingUp size={20} /> : <TrendingDown size={20} />} />
        </div>
      );
    }

    function KPICard({ title, primary, secondary, progress, color, footer, icon, note }) {
      return (
        <div className="bg-gray-900 border border-gray-800 rounded-lg p-3.5">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[10px] uppercase tracking-wide text-gray-400">{title}</span>
            {icon && <span className="text-gray-500">{icon}</span>}
          </div>
          <div className="text-xl font-bold leading-tight">{primary}</div>
          <div className="text-xs text-gray-400 mb-2">{secondary}</div>
          {note && <div className="text-[10px] text-sky-400/80 mb-1">{note}</div>}
          {progress !== null && (
            <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden mb-2">
              <div className={`h-full ${color} rounded-full transition-all`} style={{ width: `${Math.min(progress, 100)}%` }} />
            </div>
          )}
          <div className="text-[10px] text-gray-500">{footer}</div>
        </div>
      );
    }

    function NeedsAttention({ items }) {
      return (
        <section>
          <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Necesita atención</h2>
          <div className="bg-gray-900 border border-gray-800 rounded-lg divide-y divide-gray-800">
            {items.map((it, i) => (
              <div key={i} className="px-3 py-2 flex items-start gap-2">
                <span className="mt-0.5">
                  {it.severity === 'warn'
                    ? <AlertTriangle size={13} className="text-amber-400" />
                    : <AlertCircle size={13} className="text-blue-400" />}
                </span>
                <div className="flex-1">
                  <div className="text-xs">{it.text}</div>
                  {it.sub && <div className="text-[10px] text-gray-500 mt-0.5">{it.sub}</div>}
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function BudgetTable({ rows, data, month }) {
      const [expanded, setExpanded] = useState(new Set());
      const toggle = (name) => {
        const next = new Set(expanded);
        if (next.has(name)) next.delete(name); else next.add(name);
        setExpanded(next);
      };

      // For each parent, find its subs from monthly_by_sub for the current month
      const subsForParent = (parentName) => {
        const out = [];
        const prefix = `${parentName} / `;
        for (const [key, byMonth] of Object.entries(data.monthly_by_sub || {})) {
          if (!key.startsWith(prefix)) continue;
          const spend = byMonth[month] || 0;
          if (spend <= 0) continue;
          out.push({ name: key.slice(prefix.length), spend });
        }
        return out.sort((a, b) => b.spend - a.spend);
      };

      return (
        <section>
          <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Presupuesto vs gasto — mes actual</h2>
          <div className="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
            {rows.map((r) => {
              const p = r.budget > 0 ? pct(r.spend, r.budget) : null;
              const color = r.budget > 0 ? categoryBudgetColor(p) : 'bg-gray-700';
              const isOpen = expanded.has(r.name);
              const subs = isOpen ? subsForParent(r.name) : [];
              return (
                <div key={r.name} className="border-b border-gray-800 last:border-b-0">
                  <button
                    onClick={() => toggle(r.name)}
                    className="w-full text-left px-3 py-2 hover:bg-gray-800/30 transition-colors"
                  >
                    <div className="flex items-center justify-between text-xs mb-1">
                      <span className="flex items-center gap-1.5">
                        <ChevronRight size={11}
                          className={`text-gray-600 transition-transform ${isOpen ? 'rotate-90' : ''}`} />
                        {r.name}
                      </span>
                      <span className="text-gray-400 text-[11px]">
                        {fmtCOPfull(r.spend)} {r.budget > 0 && <span className="text-gray-600">/ {fmtCOPfull(r.budget)}</span>}
                        {p !== null && (
                          <span className={`ml-2 font-medium ${categoryBudgetTextColor(p)}`}>{p}%</span>
                        )}
                      </span>
                    </div>
                    <div className="h-1 bg-gray-800 rounded-full overflow-hidden">
                      <div className={`h-full ${color} rounded-full transition-all`}
                           style={{ width: `${r.budget > 0 ? Math.min(p, 100) : 100}%` }} />
                    </div>
                  </button>
                  {isOpen && (
                    <div className="bg-gray-950/50 border-t border-gray-800 px-3 py-1.5">
                      {subs.length === 0 ? (
                        <div className="text-[10px] text-gray-600 py-1">(sin gasto en subcategorías este mes)</div>
                      ) : (
                        subs.map((s) => {
                          const sharePct = r.spend > 0 ? Math.round((s.spend / r.spend) * 100) : 0;
                          return (
                            <div key={s.name} className="flex items-center gap-2 py-1">
                              <div className="flex-1 text-[11px] text-gray-300">{s.name}</div>
                              <div className="text-[10px] text-gray-500 w-10 text-right">{sharePct}%</div>
                              <div className="text-[11px] text-gray-400 w-28 text-right">{fmtCOPfull(s.spend)}</div>
                            </div>
                          );
                        })
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </section>
      );
    }

    function RecentActivity({ data, onSelectTx }) {
      const [expanded, setExpanded] = useState(false);
      const visible = expanded ? 25 : 8;
      const recent = useMemo(() =>
        [...data.transactions]
          .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')))
          .slice(0, visible), [data, visible]);
      return (
        <section>
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm uppercase tracking-wide text-gray-400">Actividad reciente</h2>
            <button
              onClick={() => setExpanded(!expanded)}
              className="text-xs text-blue-400 hover:text-blue-300"
            >
              {expanded ? `mostrar 8` : `mostrar más`}
            </button>
          </div>
          <div className="bg-gray-900 border border-gray-800 rounded-xl divide-y divide-gray-800">
            {recent.map((t) => <TxRow key={t.id} tx={t} onClick={() => onSelectTx(t)} />)}
          </div>
          <p className="text-xs text-gray-500 mt-2">
            Para ver todas, usa la pestaña <span className="text-gray-400">Todas las transacciones</span>.
          </p>
        </section>
      );
    }

    function TxRow({ tx, onClick }) {
      const isUncat = !tx.category_id;
      const isIncome = INCOME_CATS.has(tx.parent);
      // Boolean() matters: is_split is the NUMBER 0 for ordinary charges, and
      // `0 && <pill/>` makes React print a literal "0" next to every merchant.
      const notMine  = Boolean(tx.is_split && tx.split_owed >= tx.amount);
      const partial  = Boolean(tx.is_split && tx.split_owed > 0 && tx.split_owed < tx.amount);
      const estimated = tx.source === 'Estimado';
      const queued = React.useContext(PendingContext)[tx.id];
      return (
        <button onClick={onClick}
          className="w-full text-left px-3 py-2 hover:bg-gray-800/50 transition-colors flex items-center gap-2">
          <div className="flex-shrink-0 text-[10px] text-gray-500 w-16">{tx.date}</div>
          <div className="flex-1 min-w-0">
            <div className="text-xs truncate flex items-center gap-1.5">
              <span className={notMine ? 'line-through text-gray-500' : ''}>{tx.merchant}</span>
              {notMine && <span className="text-[9px] px-1.5 py-0.5 rounded bg-amber-900/50 border border-amber-800 text-amber-300 flex-shrink-0">🚫 No fue mío</span>}
              {partial && <span className="text-[9px] px-1.5 py-0.5 rounded bg-amber-900/40 border border-amber-800 text-amber-300 flex-shrink-0">➗ Split</span>}
              {estimated && <span className="text-[9px] px-1.5 py-0.5 rounded bg-sky-900/40 border border-sky-800 text-sky-300 flex-shrink-0">~ estimado</span>}
              {tx.trip_id && <span className="text-[9px] px-1.5 py-0.5 rounded bg-amber-900/30 border border-amber-800/70 text-amber-300 flex-shrink-0">✈ {tx.trip_name}</span>}
              {tx.scope && !tx.trip_id && <span className="text-[9px] px-1.5 py-0.5 rounded bg-violet-900/30 border border-violet-800/70 text-violet-300 flex-shrink-0 capitalize">👤 {tx.scope}</span>}
              {queued && <span title={`En cola: ${queued.join(', ')}`} className="text-[9px] px-1.5 py-0.5 rounded bg-violet-900/40 border border-violet-700 text-violet-300 flex-shrink-0">⏳ pendiente de sync</span>}
            </div>
            <div className="text-[10px] text-gray-500 truncate">
              {isUncat ? <span className="text-amber-500">⚠ sin categoría</span> : <span>{tx.label}</span>}
            </div>
          </div>
          <div className={`text-xs font-medium ${isIncome ? 'text-emerald-400' : ''} ${notMine ? 'text-gray-500 line-through' : ''}`}>
            {isIncome ? '+' : ''}{fmtCOPfull(tx.amount)}
          </div>
          <ChevronRight size={12} className="text-gray-600 flex-shrink-0" />
        </button>
      );
    }

    // ────────────────────────────────────────────────────────────────────────
    // Viajes — one card per trip. Trips are kept out of the main spending views;
    // this is where they live. Sending a charge back to the main dashboard is a
    // manual last resort, so it has to be easy — including in bulk.
    // ────────────────────────────────────────────────────────────────────────
    function TripsView({ data, onSelectTx, postEdit }) {
      const trips = data.trips || [];
      const [selected, setSelected] = useState({});       // tx_id → true
      const [busy, setBusy] = useState(false);
      const MONTH_ABBR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      const fmtDay = (iso) => { const [, m, d] = iso.split('-'); return `${parseInt(d, 10)} ${MONTH_ABBR[parseInt(m, 10) - 1]}`; };

      if (!trips.length) {
        return (
          <div className="bg-gray-900 border border-gray-800 rounded-xl p-6 text-sm text-gray-400">
            Aún no hay viajes. Cuando creemos uno, sus gastos salen del dashboard principal y aparecen aquí.
          </div>
        );
      }

      const selectedIds = Object.keys(selected).filter((k) => selected[k]).map(Number);
      const toggle = (id) => setSelected((s) => ({ ...s, [id]: !s[id] }));

      const sendBack = async () => {
        if (!selectedIds.length) return;
        if (!confirm(`¿Enviar ${selectedIds.length} transacción(es) de vuelta al dashboard principal?`)) return;
        setBusy(true);
        let ok = 0;
        for (const id of selectedIds) {
          if (await postEdit({ kind: 'trip', tx_id: id, trip_id: null })) ok += 1; else break;
        }
        setBusy(false);
        if (ok === selectedIds.length) setSelected({});
      };

      return (
        <div className="space-y-8">
          {trips.map((t) => {
            const rows = data.transactions
              .filter((x) => x.trip_id === t.id)
              .sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
            const pre = rows.filter((x) => x.date < t.start).reduce((s, x) => s + x.share, 0);
            const during = rows.filter((x) => x.date >= t.start).reduce((s, x) => s + x.share, 0);
            const perDay = t.days ? Math.round(during / t.days) : 0;
            const catEntries = Object.entries(t.by_category || {});
            const catMax = Math.max(1, ...catEntries.map(([, v]) => v));
            const dayData = [];
            for (let i = 0; i < t.days; i++) {
              const d = new Date(t.start + 'T00:00:00'); d.setDate(d.getDate() + i);
              const iso = d.toISOString().slice(0, 10);
              dayData.push({ day: fmtDay(iso), total: (t.by_day || {})[iso] || 0 });
            }
            const mineSelected = rows.filter((x) => selected[x.id]).length;
            return (
              <section key={t.id}>
                <div className="flex items-baseline justify-between mb-2">
                  <h2 className="text-[11px] uppercase tracking-wide text-gray-400">✈ {t.name}</h2>
                  <span className="text-[10px] text-gray-500">{fmtDay(t.start)} → {fmtDay(t.end)} · {t.days} días · {t.tx_count} cargos</span>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="bg-gray-900 border border-amber-800/50 rounded-xl p-4">
                    <div className="text-[10px] uppercase tracking-wide text-gray-400">Total del viaje</div>
                    <div className="text-xl font-semibold text-amber-300 mt-1">{fmtCOPfull(t.total)}</div>
                  </div>
                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                    <div className="text-[10px] uppercase tracking-wide text-gray-400">Pre-pagado</div>
                    <div className="text-lg font-semibold mt-1">{fmtCOPfull(pre)}</div>
                    <div className="text-[10px] text-gray-500">vuelos, hospedaje…</div>
                  </div>
                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                    <div className="text-[10px] uppercase tracking-wide text-gray-400">Durante el viaje</div>
                    <div className="text-lg font-semibold mt-1">{fmtCOPfull(during)}</div>
                  </div>
                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                    <div className="text-[10px] uppercase tracking-wide text-gray-400">Por día (sin pre-pagado)</div>
                    <div className="text-lg font-semibold mt-1">{fmtCOPfull(perDay)}</div>
                    {t.budget ? <div className="text-[10px] text-gray-500">presupuesto {fmtCOPfull(t.budget)}</div> : null}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 mt-3">
                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                    <div className="text-[10px] uppercase tracking-wide text-gray-400 mb-3">Por categoría</div>
                    <div className="space-y-2">
                      {catEntries.map(([name, v]) => (
                        <div key={name}>
                          <div className="flex justify-between text-xs"><span>{name}</span><span className="text-gray-400">{fmtCOPfull(v)}</span></div>
                          <div className="h-1.5 rounded bg-gray-800 mt-1"><div className="h-1.5 rounded bg-amber-500" style={{ width: `${(v / catMax) * 100}%` }} /></div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                    <div className="text-[10px] uppercase tracking-wide text-gray-400 mb-2">Gasto por día (durante el viaje)</div>
                    <ResponsiveContainer width="100%" height={190}>
                      <BarChart data={dayData}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" vertical={false} />
                        <XAxis dataKey="day" stroke="#6b7280" fontSize={11} interval={0} />
                        <YAxis stroke="#6b7280" fontSize={11} width={48} tickFormatter={(v) => fmtCOP(v)} />
                        <Tooltip contentStyle={{ backgroundColor: '#111827', border: '1px solid #1f2937', borderRadius: '0.5rem' }}
                                 formatter={(v) => [fmtCOPfull(v), 'Gasto']} />
                        <Bar dataKey="total" fill="#f59e0b" radius={[4, 4, 0, 0]} isAnimationActive={false} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="mt-3 bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
                  <div className="px-3 py-2 border-b border-gray-800 flex items-center justify-between">
                    <span className="text-[10px] uppercase tracking-wide text-gray-400">Cargos del viaje</span>
                    {mineSelected > 0 ? (
                      <div className="flex items-center gap-2">
                        <button onClick={() => setSelected({})} className="text-[11px] text-gray-400 hover:text-white">Limpiar</button>
                        <button onClick={sendBack} disabled={busy}
                                className="text-[11px] px-2.5 py-1 rounded bg-blue-700 hover:bg-blue-600 disabled:opacity-50">
                          {busy ? 'Enviando…' : `Enviar ${mineSelected} al dashboard principal`}
                        </button>
                      </div>
                    ) : <span className="text-[10px] text-gray-600">marca cargos para devolverlos al dashboard principal</span>}
                  </div>
                  <div className="divide-y divide-gray-800/60">
                    {rows.map((x) => (
                      <div key={x.id} className="flex items-center">
                        <label className="pl-3 pr-1 py-2 cursor-pointer" onClick={(e) => e.stopPropagation()}>
                          <input type="checkbox" checked={!!selected[x.id]} onChange={() => toggle(x.id)} />
                        </label>
                        <div className="flex-1 min-w-0"><TxRow tx={x} onClick={() => onSelectTx(x)} /></div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            );
          })}
        </div>
      );
    }

    // ────────────────────────────────────────────────────────────────────────
    // Personal — spending from each person's OWN money, against the allowance.
    // The allowance is a % of household income that EACH person keeps (so the
    // household gives up 2×). The % is a shared setting: the slider previews
    // instantly, and only "Guardar" sends it (through the edit queue, like every
    // other change), so both of you see what was saved, not what's on one screen.
    // ────────────────────────────────────────────────────────────────────────
    function PersonalView({ data, month, onSelectTx, postEdit, userIdentity }) {
      const pending = React.useContext(PendingContext);
      const [person, setPerson] = useState(['santi', 'lau'].includes(userIdentity) ? userIdentity : 'santi');
      const [touched, setTouched] = useState(false);
      const [pctLocal, setPctLocal] = useState(10);
      const [selected, setSelected] = useState({});
      const [busy, setBusy] = useState(false);
      const [sinceLocal, setSinceLocal] = useState(null);           // 'YYYY-MM' while editing

      const savedSince = data.settings?.household_since?.value;    // YYYYMM number | undefined
      const queuedSince = pending['setting:household_since'];
      const sinceNum = queuedSince ?? savedSince ?? 202611;        // default: Nov 2026
      const toYm = (n) => `${Math.floor(n / 100)}-${String(n % 100).padStart(2, '0')}`;
      const sinceShown = sinceLocal ?? toYm(sinceNum);
      const sinceDirty = sinceLocal !== null && sinceLocal !== toYm(sinceNum);

      const saved = data.settings?.allowance_pct?.value;          // number | undefined
      const queued = pending['setting:allowance_pct'];             // value waiting for a Sync | undefined
      const pct = touched ? pctLocal : (queued ?? saved ?? 10);
      const isSet = saved !== undefined || queued !== undefined;
      // Show Guardar when the slider was moved off the stored value, OR when nothing is
      // stored yet: the 10% preview must be savable without having to drag away and back.
      const dirty = (touched && pctLocal !== (queued ?? saved)) || !isSet;

      // Household income for the month — base income only, so a bonus month
      // doesn't blow the allowance up (same rule as the Balance chart).
      const inc = { santi: 0, lau: 0, otros: 0 };
      (data.income_transactions || [])
        .filter((t) => t.ym === month && t.parent !== 'Ingresos extras')
        .forEach((t) => { inc[t.person === 'lau' ? 'lau' : t.person === 'santi' ? 'santi' : 'otros'] += t.amount; });
      const householdIncome = inc.santi + inc.lau + inc.otros;
      const allowance = Math.round((pct / 100) * householdIncome);
      const spent = (data.monthly_personal?.[person] || {})[month] || 0;
      const left = allowance - spent;
      const usedPct = allowance > 0 ? Math.round((spent / allowance) * 100) : 0;
      const barColor = usedPct >= 100 ? 'bg-red-500' : usedPct >= 85 ? 'bg-orange-500' : usedPct >= 70 ? 'bg-yellow-500' : 'bg-emerald-500';

      const rows = data.transactions
        .filter((t) => t.scope === person && !t.trip_id && t.ym === month)
        .sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
      const selectedIds = rows.filter((r) => selected[r.id]).map((r) => r.id);

      const save = async () => {
        setBusy(true);
        const ok = await postEdit({ kind: 'setting', key: 'allowance_pct', value: pct });
        setBusy(false);
        if (ok) setTouched(false);
      };
      const saveSince = async () => {
        if (!/^\d{4}-\d{2}$/.test(sinceShown)) return;
        setBusy(true);
        const ok = await postEdit({ kind: 'setting', key: 'household_since', value: parseInt(sinceShown.replace('-', ''), 10) });
        setBusy(false);
        if (ok) setSinceLocal(null);
      };
      // What really leaves the household balance this month (see personalOutflow).
      const outflow = personalOutflow(data, month);
      const overspent = spent > allowance && allowance > 0;
      const sendBack = async () => {
        if (!selectedIds.length) return;
        if (!confirm(`¿Devolver ${selectedIds.length} cargo(s) al hogar?`)) return;
        setBusy(true);
        let ok = 0;
        for (const id of selectedIds) { if (await postEdit({ kind: 'scope', tx_id: id, scope: null })) ok += 1; else break; }
        setBusy(false);
        if (ok === selectedIds.length) setSelected({});
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center gap-2">
            {['santi', 'lau'].map((p) => (
              <button key={p} onClick={() => { setPerson(p); setSelected({}); }}
                className={`px-3 py-1 rounded text-xs capitalize ${p === person ? 'bg-violet-600 text-white' : 'bg-gray-800 text-gray-300'}`}>{p}</button>
            ))}
            <span className="text-[10px] text-gray-500 ml-2">{month}</span>
          </div>

          <section>
            <h2 className="text-[11px] uppercase tracking-wide text-gray-400 mb-2">Allowance personal</h2>
            <div className="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4">
              <div>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs text-gray-300">% del ingreso del hogar que se queda cada uno</span>
                  <div className="flex items-center gap-1">
                    <input type="number" min="0" max="30" step="0.5" value={pct}
                      onChange={(e) => { setTouched(true); setPctLocal(Math.max(0, Math.min(30, parseFloat(e.target.value) || 0))); }}
                      className="w-16 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs text-right" />
                    <span className="text-xs text-gray-400">%</span>
                  </div>
                </div>
                <input type="range" min="0" max="30" step="0.5" value={pct} className="w-full accent-violet-500"
                  onChange={(e) => { setTouched(true); setPctLocal(parseFloat(e.target.value)); }} />
                <div className="flex items-center justify-between mt-1 text-[10px]">
                  <span className="text-gray-500">
                    {queued !== undefined ? `⏳ ${queued}% en cola — se aplica en la próxima sync`
                      : saved !== undefined ? `Guardado: ${saved}%${data.settings.allowance_pct.updated_by ? ` (por ${data.settings.allowance_pct.updated_by})` : ''}`
                      : 'Aún sin guardar — esto es una vista previa; pulsa Guardar para fijarlo'}
                  </span>
                  {dirty
                    ? <button onClick={save} disabled={busy} className="px-2.5 py-1 rounded bg-violet-700 hover:bg-violet-600 disabled:opacity-50 text-[11px] text-white">{busy ? 'Enviando…' : `Guardar ${pct}%`}</button>
                    : null}
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                <div><div className="text-[10px] uppercase text-gray-400">Ingreso del hogar</div>
                     <div className="font-medium">{fmtCOPfull(householdIncome)}</div>
                     <div className="text-[10px] text-gray-500">Santi {fmtCOP(inc.santi)} · Lau {fmtCOP(inc.lau)}</div></div>
                <div><div className="text-[10px] uppercase text-gray-400">Allowance de cada uno</div>
                     <div className="font-medium text-violet-300">{fmtCOPfull(allowance)}</div>
                     <div className="text-[10px] text-gray-500">total fuera del hogar: {fmtCOPfull(allowance * 2)}</div></div>
                <div><div className="text-[10px] uppercase text-gray-400 capitalize">Gastado — {person}</div>
                     <div className="font-medium">{fmtCOPfull(spent)}</div></div>
                <div><div className="text-[10px] uppercase text-gray-400">Te queda (según lo registrado)</div>
                     <div className={`font-medium ${left < 0 ? 'text-red-400' : 'text-emerald-300'}`}>{fmtCOPfull(left)}</div></div>
              </div>

              <div>
                <div className="h-2 rounded bg-gray-800"><div className={`h-2 rounded ${barColor}`} style={{ width: `${Math.min(usedPct, 100)}%` }} /></div>
                <div className="text-[10px] text-gray-500 mt-1">{allowance > 0 ? `${usedPct}% del allowance registrado usado` : 'Sin ingreso del hogar registrado este mes'}</div>
                {overspent && <div className="text-[10px] text-orange-400 mt-1">Lo registrado supera el allowance. No se descuenta de nuevo del balance: es solo un aviso.</div>}
              </div>

              <div className="rounded border border-violet-900/60 bg-violet-950/20 px-3 py-2">
                <div className="text-[10px] uppercase tracking-wide text-gray-400">Sale del balance del hogar en {month}</div>
                <div className="text-sm font-medium text-violet-300">{fmtCOPfull(outflow.amount)}
                  <span className="text-[10px] text-gray-500 font-normal ml-2">
                    {outflow.mode === 'allowance' ? `= 2 × ${saved ?? queued ?? pct}% del ingreso del hogar`
                      : outflow.mode === 'tagged' ? 'solo lo registrado: el allowance aún no aplica este mes'
                      : 'el gasto personal sigue dentro de los totales del hogar'}
                  </span></div>
                <div className="text-[10px] text-gray-500 mt-1">
                  El allowance sale del hogar desde el momento en que cada uno lo recibe, lo gaste o no. Lo registrado abajo es solo informativo:
                  {person === 'lau' ? ' Lau puede gastar desde otras cuentas que este tablero no ve.' : ' solo se ve lo que pasa por las tarjetas registradas.'}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2 text-[11px] text-gray-400">
                <span>El esquema de allowance rige desde:</span>
                <input type="month" value={sinceShown} onChange={(e) => setSinceLocal(e.target.value)}
                       className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs text-gray-200" />
                {sinceDirty
                  ? <button onClick={saveSince} disabled={busy} className="px-2.5 py-1 rounded bg-violet-700 hover:bg-violet-600 disabled:opacity-50 text-white">Guardar</button>
                  : <span className="text-gray-500">{queuedSince !== undefined ? '⏳ en cola' : savedSince !== undefined ? 'guardado' : 'por defecto'}</span>}
                <span className="text-gray-600">Antes de ese mes el balance solo descuenta los cargos personales registrados.</span>
              </div>

              {inc.lau === 0 && (
                <div className="text-[11px] text-amber-400/90 bg-amber-950/30 border border-amber-900/60 rounded px-3 py-2">
                  Falta registrar el ingreso de Lau este mes: el ingreso del hogar incluye solo a Santi, así que estas cifras son provisionales.
                </div>
              )}
            </div>
          </section>

          <section>
            <div className="flex items-baseline justify-between mb-2">
              <h2 className="text-[11px] uppercase tracking-wide text-gray-400 capitalize">Gastos personales de {person}</h2>
              <span className="text-[10px] text-gray-500">{rows.length} cargo(s) · {fmtCOPfull(spent)}</span>
            </div>
            <div className="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
              <div className="px-3 py-2 border-b border-gray-800 flex items-center justify-between">
                <span className="text-[10px] text-gray-500">Para marcar un cargo como personal: ábrelo → Editar → Ámbito</span>
                {selectedIds.length > 0 && (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setSelected({})} className="text-[11px] text-gray-400 hover:text-white">Limpiar</button>
                    <button onClick={sendBack} disabled={busy} className="text-[11px] px-2.5 py-1 rounded bg-blue-700 hover:bg-blue-600 disabled:opacity-50">
                      {busy ? 'Enviando…' : `Devolver ${selectedIds.length} al hogar`}
                    </button>
                  </div>
                )}
              </div>
              {rows.length === 0
                ? <div className="px-4 py-6 text-sm text-gray-500">Ningún cargo personal de {person} en {month}.</div>
                : <div className="divide-y divide-gray-800/60">
                    {rows.map((x) => (
                      <div key={x.id} className="flex items-center">
                        <label className="pl-3 pr-1 py-2 cursor-pointer"><input type="checkbox" checked={!!selected[x.id]} onChange={() => setSelected((s) => ({ ...s, [x.id]: !s[x.id] }))} /></label>
                        <div className="flex-1 min-w-0"><TxRow tx={x} onClick={() => onSelectTx(x)} /></div>
                      </div>
                    ))}
                  </div>}
            </div>
          </section>
        </div>
      );
    }

    function TrendsView({ data, month }) {
      const months12 = lastNMonths(data.months, 12, month);
      const parents = (data.categories?.parents || []).filter((p) => !INCOME_CATS.has(p.name));

      const MONTH_ABBR = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      const fmtMonthTick = (ym) => {
        const [y, mm] = String(ym).split('-');
        const label = MONTH_ABBR[parseInt(mm, 10) - 1] || ym;
        return mm === '01' ? `${label} ${y.slice(2)}` : label;
      };
      const spendOf = (m) => {
        let t = (data.monthly_by_parent[''] || {})[m] || 0;
        parents.forEach((p) => { t += (data.monthly_by_parent[p.name] || {})[m] || 0; });
        return t;
      };

      // ── 1. Total spend per month ────────────────────────────────────────
      // Same definition as the KPI card so the line always agrees with "Este mes".
      const totalsData = months12.map((m) => ({ month: m, total: spendOf(m) }));
      const nowYm = new Date().toISOString().slice(0, 7);
      const hasPartial = totalsData.some((d) => d.month === nowYm);
      const complete = totalsData.filter((d) => d.month !== nowYm);
      const avgTotal = complete.length
        ? Math.round(complete.reduce((s, d) => s + d.total, 0) / complete.length) : 0;
      const TotalDot = ({ cx, cy, payload }) => (
        <circle cx={cx} cy={cy} r={4} strokeWidth={2}
                fill={payload.month === nowYm ? '#111827' : '#60a5fa'}
                stroke={payload.month === nowYm ? '#f59e0b' : '#60a5fa'} />
      );

      // ── 2 & 3. Top-N categories + "Otros" ───────────────────────────────
      // 13 stacked series is unreadable and only the bottom one has a common
      // baseline. Seven named + Otros keeps ~85% of spend explicit while
      // staying inside what anyone can actually distinguish.
      const TOP_N = 7;
      const ranked = parents
        .map((p) => [p.name, months12.reduce((s, m) => s + ((data.monthly_by_parent[p.name] || {})[m] || 0), 0)])
        .sort((a, b) => b[1] - a[1]);
      const TOP = ranked.slice(0, TOP_N).map((r) => r[0]);
      const SERIES = [...TOP, 'Otros'];
      const seriesColor = (name, i) => (name === 'Otros' ? '#4b5563' : PARENT_COLORS[i % PARENT_COLORS.length]);

      const stacked = months12.map((m) => {
        const row = { month: m };
        let otros = (data.monthly_by_parent[''] || {})[m] || 0;
        parents.forEach((p) => {
          const v = (data.monthly_by_parent[p.name] || {})[m] || 0;
          if (TOP.includes(p.name)) row[p.name] = v; else otros += v;
        });
        row['Otros'] = otros;
        return row;
      });
      // Same series, expressed as share — answers "where is it going" rather
      // than "how much", and stays comparable when totals move.
      const share = stacked.map((row) => {
        const tot = SERIES.reduce((s, k) => s + (row[k] || 0), 0);
        const out = { month: row.month };
        SERIES.forEach((k) => { out[k] = tot ? +(((row[k] || 0) / tot) * 100).toFixed(1) : 0; });
        return out;
      });

      // ── 4. Monthly balance ──────────────────────────────────────────────
      // Only base salary — the Jan/Feb bonuses are 4x a normal month and would
      // flatten everything else. Starts at the first month with income so the
      // pre-payslip months don't render as empty space.
      const baseByMonth = {};
      (data.income_transactions || []).forEach((t) => {
        if (t.parent !== 'Ingresos extras') baseByMonth[t.ym] = (baseByMonth[t.ym] || 0) + t.amount;
      });
      const firstIncome = months12.find((m) => (baseByMonth[m] || 0) > 0);
      const balanceData = (firstIncome ? months12.filter((m) => m >= firstIncome) : []).map((m) => {
        const ingresos = baseByMonth[m] || 0;
        const gastosMain = spendOf(m);              // without trips (when excluded)
        const viajes = tripAddBack(data, m);        // …added back: the money is gone
        const personal = personalOutflow(data, m).amount;  // allowances leave the household balance
        const gastos = gastosMain + viajes + personal;
        return { month: m, ingresos, gastos, gastosMain, viajes, personal,
                 Balance: ingresos > 0 ? ingresos - gastos : null };
      });
      const acumulado = balanceData.reduce((s, b) => s + (b.Balance || 0), 0);

      // ── 5. Spend against income, split fixed vs variable ────────────────
      // Bars are a share of INCOME (not of spending), so the headroom above
      // each bar is what's left over — no separate "disponible" band needed.
      const vsIncome = balanceData.filter((b) => b.ingresos > 0).map((b) => {
        const fijos = (data.monthly_fixed || {})[b.month] || 0;
        return {
          month: b.month, ingreso: b.ingresos,
          fijosCop: fijos, varCop: Math.max(0, b.gastosMain - fijos), viajesCop: b.viajes, personalCop: b.personal,
          'Fijos': +((fijos / b.ingresos) * 100).toFixed(1),
          'Variables': +((Math.max(0, b.gastosMain - fijos) / b.ingresos) * 100).toFixed(1),
          'Viajes': +((b.viajes / b.ingresos) * 100).toFixed(1),
          'Personal': +((b.personal / b.ingresos) * 100).toFixed(1),
        };
      });

      const tipStyle = { backgroundColor: '#111827', border: '1px solid #1f2937', borderRadius: '0.5rem' };

      return (
        <div className="space-y-6">
          <section>
            <div className="flex items-baseline justify-between mb-2">
              <h2 className="text-[11px] uppercase tracking-wide text-gray-400">Gasto total por mes</h2>
              <span className="text-[10px] text-gray-500">
                {(data.trips_excluded || data.personal_excluded) && `sin ${[data.trips_excluded && 'viajes', data.personal_excluded && 'gasto personal'].filter(Boolean).join(' ni ')} · `}Promedio {fmtCOPfull(avgTotal)}
                {hasPartial && <span className="text-amber-500/80"> · ○ mes en curso (parcial)</span>}
              </span>
            </div>
            <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
              <ResponsiveContainer width="100%" height={260}>
                <LineChart data={totalsData} margin={{ top: 8, right: 12, bottom: 0, left: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" vertical={false} />
                  <XAxis dataKey="month" stroke="#6b7280" fontSize={11} tickMargin={6}
                         interval={0} tickFormatter={fmtMonthTick} />
                  <YAxis stroke="#6b7280" fontSize={11} width={54} tickFormatter={(v) => fmtCOP(v)} />
                  <Tooltip contentStyle={tipStyle} cursor={{ stroke: '#374151', strokeWidth: 1 }}
                           formatter={(v) => [fmtCOPfull(v), 'Gasto total']} />
                  {avgTotal > 0 && <ReferenceLine y={avgTotal} stroke="#4b5563" strokeDasharray="4 4" />}
                  <Line type="monotone" dataKey="total" name="Gasto total"
                        stroke="#60a5fa" strokeWidth={2} dot={<TotalDot />}
                        activeDot={{ r: 6, fill: '#60a5fa', stroke: '#111827', strokeWidth: 2 }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </section>

          <section>
            <div className="flex items-baseline justify-between mb-2">
              <h2 className="text-[11px] uppercase tracking-wide text-gray-400">Gasto por categoría</h2>
              <span className="text-[10px] text-gray-500">top {TOP_N} + Otros</span>
            </div>
            <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
              <ResponsiveContainer width="100%" height={340}>
                <BarChart data={stacked}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" vertical={false} />
                  <XAxis dataKey="month" stroke="#6b7280" fontSize={11} interval={0} tickFormatter={fmtMonthTick} />
                  <YAxis stroke="#6b7280" fontSize={11} width={54} tickFormatter={(v) => fmtCOP(v)} />
                  <Tooltip contentStyle={tipStyle} formatter={(v) => fmtCOPfull(v)} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  {SERIES.map((k, i) => (
                    <Bar key={k} dataKey={k} stackId="a" fill={seriesColor(k, i)} isAnimationActive={false} />
                  ))}
                </BarChart>
              </ResponsiveContainer>
            </div>
          </section>

          <section>
            <div className="flex items-baseline justify-between mb-2">
              <h2 className="text-[11px] uppercase tracking-wide text-gray-400">¿A dónde va la plata?</h2>
              <span className="text-[10px] text-gray-500">participación % · cada mes suma 100%</span>
            </div>
            <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
              <ResponsiveContainer width="100%" height={320}>
                <BarChart data={share} stackOffset="expand">
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" vertical={false} />
                  <XAxis dataKey="month" stroke="#6b7280" fontSize={11} interval={0} tickFormatter={fmtMonthTick} />
                  <YAxis stroke="#6b7280" fontSize={11} width={44} tickFormatter={(v) => Math.round(v * 100) + '%'} />
                  <Tooltip contentStyle={tipStyle} formatter={(v) => v.toFixed(1) + '%'} />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  {SERIES.map((k, i) => (
                    <Bar key={k} dataKey={k} stackId="p" fill={seriesColor(k, i)} isAnimationActive={false} />
                  ))}
                </BarChart>
              </ResponsiveContainer>
            </div>
          </section>

          {balanceData.length > 0 && (
            <section>
              <div className="flex items-baseline justify-between mb-2">
                <h2 className="text-[11px] uppercase tracking-wide text-gray-400">Balance mensual</h2>
                <span className="text-[10px] text-gray-500">acumulado {fmtCOPfull(acumulado)}</span>
              </div>
              <div className="bg-gray-900 border border-gray-800 rounded-xl p-4">
                <ResponsiveContainer width="100%" height={300}>
                  <BarChart data={balanceData} margin={{ top: 8, right: 8, bottom: 0, left: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" vertical={false} />
